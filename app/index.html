    try {
      if (!await commit()) return;
      if (isNew) { toast('Subject added', true); nav(`/capture/${S.shoot.id}/${s.id}`); }
      else { toast('Saved', true); nav('/shoot/' + S.shoot.id); }
    } finally { saving = false; sb_.disabled = false; }
  };
  smartSync = null;
  wireSmartFields(PLAN);
  const fRow = $('#flagRow');
  if (fRow) fRow.querySelectorAll('.chip').forEach(ch => ch.onclick = async () => {
    const next = flagOf(s) === ch.dataset.flag ? '' : ch.dataset.flag;
    await setFlag(s, next);
    cloudPushOneSubject(s);
    fRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', flagOf(s) === c.dataset.flag));
    const hn = $('#subjName'); if (hn) hn.classList.toggle('gone', isGone(s));
    toast(next ? FLAGS[next].label : 'Cleared', true);
  });
  if (isNew) wireSuggest();
  if (!isNew) {
    $('#capBtn').onclick = () => nav(`/capture/${S.shoot.id}/${s.id}`);
    $('#addPh').onclick = () => nav(`/capture/${S.shoot.id}/${s.id}`);
    $('#addGal').onclick = async () => { if (!await saveIfChanged()) return; S.capSubject = s; $('#galleryInput').click(); };
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Delete this photo?')) return;
      const cid = b.dataset.del;
      await dbDel('captures', cid);
      await dbDel('photos', cid);
      S.caps.set(s.id, (S.caps.get(s.id) || []).filter(c => c.id !== cid));
      if (cloudReady()) {
        // remove from cloud too (queued and retried at next Cloud Sync if offline now)
        const pend = await getMeta('cloudDeletes', []);
        if (!pend.includes(cid)) { pend.push(cid); await setMeta('cloudDeletes', pend); }
        if (navigator.onLine && S.shoot.syncKey) {
          try {
            await sb('/rest/v1/md_captures?id=eq.' + encodeURIComponent(cid), { method: 'DELETE' });
            await sb('/storage/v1/object/mdphotos/' + S.shoot.syncKey + '/' + cid + '.jpg', { method: 'DELETE' }).catch(() => {});
            const p2 = await getMeta('cloudDeletes', []);
            await setMeta('cloudDeletes', p2.filter(x => x !== cid));
          } catch (e) {}
        }
      }
      if (!(S.caps.get(s.id) || []).length) {
        // last photo removed = undo the check-in; broadcasts to other phones on next sync
        await setStatus(s.id, 'out', Date.now(), DEVICE.name || DEVICE.id);
        toast('Check-in undone — sync to update other phones');
      }
      renderSubject(s.id);
    });
    document.querySelectorAll('.ph[data-id]').forEach(el => el.addEventListener('click', async e => {
      if (e.target.closest('.del')) return;
      let rec = await dbGet('photos', el.dataset.id);
      if (!rec && cloudReady() && navigator.onLine && S.shoot.syncKey) {
        // full-size copy was freed at archive time — bring it back from the cloud
        try {
          toast('Fetching from cloud…');
          const blob = await (await sb('/storage/v1/object/mdphotos/' + S.shoot.syncKey + '/' + el.dataset.id + '.jpg')).blob();
          rec = { id: el.dataset.id, blob };
          await dbPut('photos', rec); // cached again locally
        } catch (err) { toast('Photo lives in the cloud — no connection right now'); return; }
      }
      if (!rec) { toast('Full-size photo is in the cloud — connect to view it'); return; }
      const v = document.createElement('div');
      v.className = 'viewer';
      v.innerHTML = `<img src="${url(rec.blob)}">`;
      v.onclick = () => v.remove();
      document.body.appendChild(v);
    }));
    const pl = $('#provLine'); if (pl) pl.onclick = () => showProvenance(s);
    $('#delSubBtn').onclick = async () => {
      const n = (S.caps.get(s.id) || []).length;
      if (!confirm(`Delete ${displayName(s)}${n ? ` and their ${n} photo(s)` : ''}?`)) return;
      LEAVE_HOOK = null; // deleting — don't let the leave-save write them back
      for (const c of (S.caps.get(s.id) || [])) { await dbDel('captures', c.id); await dbDel('photos', c.id); }
      S.caps.delete(s.id);
      await dbDel('remote', S.shoot.id + '|' + s.id);
      S.R.delete(s.id);
      await subDel(S.shoot.id, s.id);
      S.subjects = S.subjects.filter(x => x.id !== s.id);
      await cloudDeleteSubject(s.id); // tombstone so other devices remove them too
      toast('Deleted');
      nav('/shoot/' + S.shoot.id);
    };
  }
}

/* ============================================================
   Phone-to-phone sync via QR codes (works with zero signal).
   The payload carries: every checked-in subject id this phone
   knows about (its own + ones learned from other phones), the
   "handled" set, and any walk-up subjects that were added.
   Subject ids are deterministic from the CSV, so all phones
   that imported the same roster agree on them.
   ============================================================ */
const QR_CHUNK = 700; // chars of payload per QR (stays well inside easy-scan territory)

/* Both phones imported the same CSV, so both can rebuild the identical sorted
   id list — check-ins are sent as tiny indices into it instead of full ids. */
const rosterIndex = () => S.subjects.filter(s => !s.added).map(s => s.id).sort();
async function buildSyncPayload() {
  const idx = rosterIndex();
  const pos = new Map(idx.map((id, i) => [id, i]));
  // one status entry per subject we know anything about: [index-or-id, minutes-since-epoch, 1=in/0=out]
  const ei = [], ex = [];
  for (const s of S.subjects) {
    const reg = myRegister(s);
    if (!reg) continue;
    const tsm = Math.round(reg.ts / 60000);
    const stFlag = reg.state === 'in' ? 1 : 0;
    if (pos.has(s.id)) ei.push([pos.get(s.id), tsm, stFlag]);
    else ex.push([s.id, tsm, stFlag]);
  }
  ei.sort((a, b) => a[0] - b[0]);
  const hi = [], hx = [];
  for (const s of S.subjects) if (s.handled) (pos.has(s.id) ? hi : hx).push(pos.has(s.id) ? pos.get(s.id) : s.id);
  hi.sort((a, b) => a - b);
  // absent / no-longer-there marks: [index-or-id, 1=absent 2=gone 0=cleared, minutes]
  const fi = [], fx = [];
  const FCODE = { absent: 1, gone: 2 };
  for (const s of S.subjects) {
    if (!s.flagTs) continue;
    const row = [FCODE[s.flag] || 0, Math.round(s.flagTs / 60000)];
    if (pos.has(s.id)) fi.push([pos.get(s.id), ...row]);
    else fx.push([s.id, ...row]);
  }
  fi.sort((a, b) => a[0] - b[0]);
  const obj = {
    v: 3,
    k: S.shoot.syncKey || '',
    d: DEVICE.name || DEVICE.id,
    ei, ex, hi, hx, fi, fx,
    c: S.shoot.columns || [],   // v0.14.4: fields added on site ride along (older phones ignore it)
    a: S.subjects.filter(s => s.added).map(s => ({ k: s.id, f: s.first, l: s.last, x: s.extra || {}, at: s.addedAt || '', by: s.addedBy || '' }))
  };
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let flag = 'j', u8 = raw;
  if ('CompressionStream' in window) { flag = 'z'; u8 = await deflate(raw); }
  return flag + b64uEnc(u8);
}
async function decodeSyncPayload(payload) {
  const flag = payload[0], u8 = b64uDec(payload.slice(1));
  const raw = flag === 'z' ? await inflate(u8) : u8;
  return JSON.parse(new TextDecoder().decode(raw));
}
async function applySync(obj) {
  if (!obj || (obj.v !== 3)) {
    throw new Error(obj && obj.v ? 'The phones are running different MatchDay versions — open the app while online on both to update, then retry' : 'Not a MatchDay sync code');
  }
  const sameRoster = (obj.k || '') === (S.shoot.syncKey || '');
  if (!sameRoster) {
    if (!confirm('This code is from a DIFFERENT roster/shoot (or one phone loaded an edited CSV). Names added on site will still merge; roster check-ins cannot. Continue?')) return null;
  }
  let newCaps = 0, newUndo = 0, newAdd = 0, newHand = 0;
  if (sameRoster) await adoptColumns(obj.c);
  for (const a of obj.a || []) {
    if (!S.subjects.find(s => s.id === a.k)) {
      // v0.14.0: adopt the id as sent. Another job on this phone may hold the same key —
      // that is now a legal, separate row, not a collision to route around.
      const sub = { id: a.k, shootId: S.shoot.id, first: a.f || '', last: a.l || '', extra: a.x || {}, added: true, deviceId: 'sync', updatedAt: nowISO(), ...stampFrom(a) };
      await dbPut('subjects', sub);
      S.subjects.push(sub);
      newAdd++;
    }
  }
  const idx = rosterIndex();
  const entries = [], handIds = [];
  if (sameRoster) { // index-based ids are only safe when both phones share the roster
    for (const [i, tsm, st] of obj.ei || []) if (idx[i]) entries.push([idx[i], tsm, st]);
    for (const i of obj.hi || []) if (idx[i]) handIds.push(idx[i]);
  }
  for (const e of obj.ex || []) entries.push(e);
  handIds.push(...(obj.hx || []));
  const known = new Set(S.subjects.map(s => s.id));
  for (const [sid, tsm, st] of entries) {
    if (!known.has(sid)) continue; // id from a roster we don't have — skip quietly
    const wasDone = isDoneId(sid);
    const changed = await setStatus(sid, st ? 'in' : 'out', tsm * 60000, obj.d || 'other phone');
    if (!changed) continue;
    const nowDone = isDoneId(sid);
    if (!wasDone && nowDone) newCaps++;
    if (wasDone && !nowDone) newUndo++;
  }
  for (const sid of handIds) {
    const s = S.subjects.find(x => x.id === sid);
    if (s && !s.handled) { s.handled = true; s.updatedAt = nowISO(); await dbPut('subjects', s); newHand++; }
  }
  // absent / no-longer-there marks, newest wins
  const FNAME = { 1: 'absent', 2: 'gone', 0: '' };
  const fEntries = [];
  if (sameRoster) for (const [i, code, tsm] of obj.fi || []) if (idx[i]) fEntries.push([idx[i], code, tsm]);
  for (const e of obj.fx || []) fEntries.push(e);
  let newFlag = 0;
  for (const [sid, code, tsm] of fEntries) {
    const s = S.subjects.find(x => x.id === sid);
    if (!s) continue;
    if (await setFlag(s, FNAME[code] || '', tsm * 60000, obj.d || 'other phone')) newFlag++;
  }
  sortSubjects();
  return { newCaps, newUndo, newAdd, newHand, newFlag };
}

/* --- full shoot share: roster + statuses over QR, for a phone with nothing --- */
async function buildShootSharePayload() {
  const cols = S.shoot.columns || [];
  const subs = S.subjects.map(s => {
    const reg = myRegister(s);
    const state = reg ? (reg.state === 'in' ? 1 : 0) : -1;
    const tsm = reg ? Math.round(reg.ts / 60000) : 0;
    const fcode = s.flag === 'absent' ? 4 : s.flag === 'gone' ? 8 : 0;
    return [s.id, s.first, s.last, cols.map(c => (s.extra || {})[c] || ''), (s.added ? 1 : 0) | (s.handled ? 2 : 0) | fcode, state, tsm, Math.round((s.flagTs || 0) / 60000)];
  });
  const obj = { t: 'S', v: 1, d: DEVICE.name || DEVICE.id, name: S.shoot.name, sd: S.shoot.shootDate || '', k: S.shoot.syncKey || '', cols, subs, w: S.shoot.watch || null };
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let flag = 'j', u8 = raw;
  if ('CompressionStream' in window) { flag = 'z'; u8 = await deflate(raw); }
  return flag + b64uEnc(u8);
}
async function receiveSharedShoot(obj) {
  if (!obj || obj.t !== 'S' || obj.v !== 1) throw new Error('Not a MatchDay shoot code');
  const shoots = await dbAll('shoots');
  let shoot = shoots.find(x => x.syncKey && x.syncKey === obj.k);
  const created = !shoot;
  /* v0.14.0: the old guard here refused the whole share if ANY incoming person key was
     already held by another job on this phone — necessary when one key could exist once
     per device, but it also blocked a legitimately different job that happened to share a
     name row. Jobs are matched on syncKey above; a genuine second copy of the same roster
     is caught there. Overlapping people are now simply stored under this job's key. */
  if (created) {
    shoot = { id: uid(), name: obj.name || 'Received shoot', shootDate: obj.sd || '', createdAt: nowISO(), updatedAt: nowISO(), columns: obj.cols || [], syncKey: obj.k || '', watch: obj.w || null };
    await dbPut('shoots', shoot);
    S.shoot = shoot;
    S.subjects = [];
    S.caps = new Map();
    S.R = new Map();
  } else {
    await loadShoot(shoot.id);
    await adoptColumns(obj.cols);
  }
  let added = 0, statuses = 0;
  for (const row of obj.subs || []) {
    const [id, f, l, exArr, flags, state, tsm, fts] = row;
    const theirFlag = (flags & 4) ? 'absent' : (flags & 8) ? 'gone' : '';
    let sub = S.subjects.find(x => x.id === id);
    if (!sub) {
      const extra = {};
      (obj.cols || []).forEach((c, i) => extra[c] = String((exArr || [])[i] || ''));
      sub = { id, shootId: shoot.id, first: f || '', last: l || '', extra, added: !!(flags & 1), handled: !!(flags & 2), flag: theirFlag, flagTs: (fts || 0) * 60000, deviceId: 'share', updatedAt: nowISO() };
      await dbPut('subjects', sub);
      S.subjects.push(sub);
      added++;
    } else {
      if ((flags & 2) && !sub.handled) { sub.handled = true; sub.updatedAt = nowISO(); await dbPut('subjects', sub); }
      if (fts) await setFlag(sub, theirFlag, fts * 60000, obj.d || 'other phone');
    }
    if (state >= 0 && tsm > 0) {
      if (await setStatus(id, state ? 'in' : 'out', tsm * 60000, obj.d || 'other phone')) statuses++;
    }
  }
  sortSubjects();
  toast(`${created ? 'Shoot received' : 'Merged into your copy'}: ${added ? added + ' people, ' : ''}${statuses} check-in statuses ✓`, true);
  nav('/shoot/' + shoot.id);
  if (!created) route(); // already on that hash — force redraw
}
async function showShootShare() {
  await loadScript('qrcode.js');
  showQRParts(await buildShootSharePayload(), 'MDS1', `${S.subjects.length} people + check-in status`,
    'The other phone: home screen → "Receive shoot". Roster and statuses transfer; reference photos stay here.');
}

/* --- show my status code --- */
async function showSyncCode() {
  await loadScript('qrcode.js');
  showQRParts(await buildSyncPayload(), 'MD1', `${doneCount()} check-ins`,
    'Point the other phone\'s "Scan sync code" at this.');
}
function showQRParts(payload, prefix, subtitle, hint) {
  const chunks = [];
  const total = Math.max(1, Math.ceil(payload.length / QR_CHUNK));
  for (let i = 0; i < total; i++) chunks.push(`${prefix}|${i + 1}|${total}|${payload.slice(i * QR_CHUNK, (i + 1) * QR_CHUNK)}`);
  let idx = 0, cycler = null;
  const ov = document.createElement('div');
  ov.className = 'cap';
  ov.style.background = 'var(--bg)';
  ov.innerHTML = `
    <div class="capTop" style="position:relative;background:none;padding-bottom:0">
      <button class="iconbtn" id="qrClose">${ICONS.close}</button>
      <div class="capName" style="text-shadow:none">${prefix === 'MDS1' ? 'Share shoot' : 'Sync code'}<small id="qrSub"></small></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 10px">
      <div class="qrbox"><img id="qrImg" alt="sync QR"></div>
      <div style="text-align:center;color:var(--dim);font-size:14px;padding:0 20px" id="qrHint"></div>
      <div class="row" style="padding:16px 20px" id="qrNavRow"></div>
    </div>`;
  document.body.appendChild(ov);
  const draw = () => {
    const q = qrcode(0, 'L');
    q.addData(chunks[idx], 'Byte');
    q.make();
    $('#qrImg').src = q.createDataURL(4, 8);
    $('#qrSub').textContent = `${subtitle} • part ${idx + 1} of ${total}`;
    $('#qrHint').textContent = (total > 1
      ? 'Parts rotate automatically — hold the phones steady until the scanner has them all. '
      : '') + hint;
    $('#qrNavRow').innerHTML = total > 1
      ? `<button class="btn" id="qrPrev">◀</button><button class="btn" id="qrNext">▶</button>`
      : '';
    if (total > 1) {
      $('#qrPrev').onclick = () => { idx = (idx - 1 + total) % total; draw(); };
      $('#qrNext').onclick = () => { idx = (idx + 1) % total; draw(); };
    }
  };
  if (total > 1) cycler = setInterval(() => { idx = (idx + 1) % total; draw(); }, 1600);
  $('#qrClose').onclick = () => { clearInterval(cycler); ov.remove(); };
  draw();
}

/* --- scan the other phone's code --- */
async function scanSyncCode() {
  let detector = null, useJsqr = false;
  if ('BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) {}
  }
  if (!detector) { await loadScript('jsqr.js'); useJsqr = true; }
  const ov = document.createElement('div');
  ov.className = 'cap';
  ov.innerHTML = `
    <video id="scanVid" autoplay playsinline muted style="flex:1;object-fit:cover;width:100%"></video>
    <div class="capTop">
      <button class="iconbtn" id="scanClose">${ICONS.close}</button>
      <div class="capName">Scan MatchDay code<small id="scanStatus">Looking for QR…</small></div>
    </div>`;
  document.body.appendChild(ov);
  let stream = null, running = true, kind = null;
  const parts = new Map();
  let totalParts = 0;
  const stop = () => { running = false; if (stream) stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  $('#scanClose').onclick = stop;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
  } catch (e) { stop(); return toast('Camera unavailable for scanning'); }
  const vid = $('#scanVid');
  vid.srcObject = stream;
  const cv = document.createElement('canvas');
  const seen = new Set();
  const tick = async () => {
    if (!running) return;
    if (vid.videoWidth) {
      cv.width = vid.videoWidth; cv.height = vid.videoHeight;
      const g = cv.getContext('2d');
      g.drawImage(vid, 0, 0);
      let text = null;
      try {
        if (detector) {
          const codes = await detector.detect(cv);
          if (codes.length) text = codes[0].rawValue;
        } else if (useJsqr) {
          const img = g.getImageData(0, 0, cv.width, cv.height);
          const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (r) text = r.data;
        }
      } catch (e) {}
      const m = text && !seen.has(text) ? text.match(/^(MD1|MDS1|MDC1)\|(\d+)\|(\d+)\|([\s\S]*)$/) : null;
      if (m) {
        seen.add(text);
        if (kind && kind !== m[1]) { /* mixed code types mid-scan — ignore stray */ }
        else {
          kind = m[1];
          totalParts = +m[3];
          parts.set(+m[2], m[4]);
          flash();
          $('#scanStatus').textContent = `Got part ${m[2]} of ${totalParts} (${parts.size}/${totalParts})`;
          if (parts.size === totalParts) {
            running = false;
            try {
              const payload = [...Array(totalParts).keys()].map(i => parts.get(i + 1)).join('');
              const obj = await decodeSyncPayload(payload);
              if (kind === 'MDC1') {
                stop();
                CLOUD = { url: obj.u, anon: obj.a, email: obj.e, access: null, refresh: null, exp: 0 };
                toast('Cloud setup received — enter the password and Connect', true);
                if (location.hash === '#/settings') renderSettings(); else nav('/settings');
              } else if (kind === 'MDS1') {
                stop();
                await receiveSharedShoot(obj);
              } else {
                if (!S.shoot) { stop(); return toast('That\'s a status code — for a whole shoot, the other phone should use "Share shoot"'); }
                const res = await applySync(obj);
                stop();
                if (res) {
                  toast(`Synced: +${res.newCaps} check-ins${res.newUndo ? `, ${res.newUndo} undone` : ''}${res.newAdd ? `, +${res.newAdd} added` : ''}${res.newHand ? `, +${res.newHand} handled` : ''}`, true);
                  route();
                }
              }
            } catch (e) { stop(); toast('Could not read that code: ' + e.message); }
            return;
          }
        }
      }
    }
    setTimeout(tick, 180);
  };
  tick();
}

/* ---------- watchlist (e.g. seniors) ---------- */
async function renderWatch() {
  const sh = S.shoot;
  const w = sh.watch || { col: '', vals: [] };
  const active = w.col && w.vals && w.vals.length;
  const matches = !active ? [] : S.subjects.filter(s =>
    w.vals.some(v => String((s.extra || {})[w.col] || '').split(',').map(x => x.trim()).includes(v)));
  const inYet = matches.filter(isDone);
  const handled = matches.filter(s => s.handled);
  // checked-in first (unhandled at top), then not-yet-arrived
  const sorted = [...matches].sort((a, b) => {
    const ka = (isDone(a) ? 0 : 2) + (a.handled ? 1 : 0);
    const kb = (isDone(b) ? 0 : 2) + (b.handled ? 1 : 0);
    return ka - kb || norm(a.last + a.first).localeCompare(norm(b.last + b.first));
  });
  freeURLs();
  $('#app').innerHTML = `
    <div class="header">
      <button class="iconbtn" onclick="nav('/shoot/${sh.id}')">${ICONS.back}</button>
      <h1>Watchlist<span class="sub">${active ? `${inYet.length}/${matches.length} checked in • ${handled.length} handled` : 'not set up yet'}</span></h1>
      <button class="iconbtn" id="wCfgBtn">${ICONS.gear}</button>
    </div>
    <div class="content">
      ${!active ? `<div class="empty">Pick who you're personally tracking —<br>e.g. Grade = 12 for seniors.<br><br><button class="btn primary" id="wSetup" style="max-width:280px;margin:0 auto">Set up watchlist</button></div>`
      : sorted.map(s => {
          const caps = S.caps.get(s.id) || [];
          const stw = S.R.get(s.id);
          const rem = !caps.length && stw && stw.state === 'in' ? stw : null;
          const av = caps.length ? `<img src="${url(caps[caps.length - 1].thumb)}">`
            : rem ? `<span style="color:var(--good)">✓</span>`
            : esc((s.first[0] || '') + (s.last[0] || '')).toUpperCase();
          const status = caps.length ? 'checked in here' : rem ? `checked in on ${esc(rem.by)}` : 'not arrived yet';
          return `<div class="wrow${isGone(s) ? ' gone' : ''}" style="${isDone(s) ? '' : 'opacity:.5'}">
            <div class="avatar">${av}</div>
            <div class="sinfo" data-open="${s.id}" style="cursor:pointer">
              <div class="sname">${nameHtml(s)}</div>
              <div class="sextra">${status}${extraLine(s) ? ' • ' + esc(extraLine(s)) : ''}</div>
            </div>
            <div class="wcheck ${s.handled ? 'on' : ''}" data-w="${s.id}" title="Mark handled">✓</div>
          </div>`;
        }).join('')}
    </div>`;
  const openCfg = () => renderWatchConfig();
  $('#wCfgBtn').onclick = openCfg;
  const su = $('#wSetup'); if (su) su.onclick = openCfg;
  document.querySelectorAll('[data-w]').forEach(el => el.onclick = async () => {
    const s = S.subjects.find(x => x.id === el.dataset.w);
    s.handled = !s.handled;
    s.updatedAt = nowISO();
    await dbPut('subjects', s);
    renderWatch();
  });

/* remove a shoot and everything belonging to it from THIS device only */
async function deleteShootLocal(shootId) {
  const caps = await dbAll('captures', 'shootId', shootId);
  for (const c of caps) { await dbDel('captures', c.id); await dbDel('photos', c.id); }
  for (const s of await dbAll('subjects', 'shootId', shootId)) await subDel(shootId, s.id);
  for (const r of await dbAll('remote', 'shootId', shootId)) await dbDel('remote', r.id);
  await dbDel('shoots', shootId);
  if (S.shoot && S.shoot.id === shootId) {
    S.shoot = null; S.subjects = []; S.caps = new Map(); S.R = new Map();
  }
}

/* deliver a zip: try share sheet if asked, else download */
async function deliverZip(zip, zname, share) {
  if (share) {
    const file = new File([zip], zname, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: zname }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zip);
  a.download = zname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

/* ============================================================
   Cloud sync (Supabase) — when internet is available, phones
   push check-ins AND photos up, and pull everyone else's down.
   Offline QR sync and ZIP merge remain the no-signal fallback.
   ============================================================ */
let CLOUD = null; // {url, anon, email, access, refresh, exp}
async function loadCloud() { CLOUD = await getMeta('cloud', null); }
const cloudReady = () => !!(CLOUD && CLOUD.url && CLOUD.anon && CLOUD.refresh);
async function cloudSignIn(url, anon, email, password) {
  // forgive common paste mistakes: missing https://, trailing paths like /rest/v1, spaces
  url = String(url || '').trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { url = new URL(url).origin; }
  catch (e) { throw new Error('that URL doesn\'t look right — it should be like https://abcdefgh.supabase.co'); }
  anon = String(anon || '').trim();
  email = String(email || '').trim();
  const r = await fetch(url + '/auth/v1/token?grant_type=password', {
    method: 'POST', headers: { apikey: anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  if (r.status === 404) throw new Error('404 — the URL is wrong. It must be exactly https://<your-ref>.supabase.co');
  if (!r.ok) throw new Error('sign-in failed (' + r.status + ') — check key, email, password');
  const j = await r.json();
  CLOUD = { url, anon, email, access: j.access_token, refresh: j.refresh_token, exp: Date.now() + ((j.expires_in || 3600) - 120) * 1000 };
  await setMeta('cloud', CLOUD);
}
async function cloudToken() {
  if (!cloudReady()) throw new Error('Cloud Sync not set up');
  if (CLOUD.access && Date.now() < (CLOUD.exp || 0)) return CLOUD.access;
  const r = await fetch(CLOUD.url + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', headers: { apikey: CLOUD.anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: CLOUD.refresh })
  });
  if (!r.ok) throw new Error('cloud session expired — reconnect in Settings');
  const j = await r.json();
  CLOUD.access = j.access_token;
  CLOUD.refresh = j.refresh_token || CLOUD.refresh;
  CLOUD.exp = Date.now() + ((j.expires_in || 3600) - 120) * 1000;
  await setMeta('cloud', CLOUD);
  return CLOUD.access;
}
async function sb(path, opts = {}) {
  const tok = await cloudToken();
  const headers = Object.assign({ apikey: CLOUD.anon, Authorization: 'Bearer ' + tok }, opts.headers || {});
  const r = await fetch(CLOUD.url + path, Object.assign({}, opts, { headers }));
  if (!r.ok) {
    // carry the database's own words — "column … does not exist" is a diagnosis, 400 isn't
    const detail = await r.text().then(t => (t || '').slice(0, 160)).catch(() => '');
    throw new Error('cloud ' + r.status + ' on ' + path.split('?')[0] + (detail ? ' — ' + detail : ''));
  }
  return r;
}
const sbJson = (path, opts) => sb(path, opts).then(r => (r.status === 204 ? null : r.json().catch(() => null)));
const sbUpsert = (table, conflict, rows) => sbJson(`/rest/v1/${table}?on_conflict=${conflict}`, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
  body: JSON.stringify(rows)
});
/* every md_subjects row this app sends is built here, so provenance can never be
   half-pushed by one code path and not another */
function subRow(s, key) {
  return {
    shoot_key: key, id: s.id, first_name: s.first, last_name: s.last,
    extra: s.extra || {}, added: !!s.added, handled: !!s.handled,
    flag: s.flag || '', flag_ts: s.flagTs || 0,
    added_at: s.addedAt || null, added_by: s.addedBy || '',
    updated_at: s.updatedAt || nowISO()
  };
}
/* MIGRATION_v0.14 may not have been run yet. Never let that reject the whole roster push
   the way the missing v0.10 columns did at Salida — drop the two new columns and send the
   rest, so names, check-ins and flags keep syncing while the SQL is outstanding. */
let _noProvCols = false;
async function pushSubjectRows(rows) {
  const strip = r => { const { added_at, added_by, ...rest } = r; return rest; };
  if (_noProvCols) return sbUpsert('md_subjects', 'shoot_key,id', rows.map(strip));
  try { return await sbUpsert('md_subjects', 'shoot_key,id', rows); }
  catch (e) {
    if (!/added_at|added_by/i.test(e.message || '')) throw e;
    _noProvCols = true;
    return sbUpsert('md_subjects', 'shoot_key,id', rows.map(strip));
  }
}
/* my current status register for one subject. Only photos THIS phone took assert 'in'
   (out-bidding stale undos) — pulled/merged copies never out-vote the origin phone's undo. */
function myRegister(s) {
  const caps = S.caps.get(s.id) || [];
  const own = caps.filter(c => c.deviceId === DEVICE.id);
  const st = S.R.get(s.id);
  if (own.length) {
    let ts = Math.max(...own.map(c => Date.parse(c.takenAt) || 0));
    if (st && st.state === 'out' && st.ts >= ts) ts = st.ts + 60000;
    return { state: 'in', ts };
  }
  if (st) return { state: st.state, ts: st.ts };
  if (caps.length) return { state: 'in', ts: Math.max(...caps.map(c => Date.parse(c.takenAt) || 0)) };
  return null;
}
/* fire-and-forget push of one subject row (absent / no-longer-there marks, edits) */
async function cloudPushOneSubject(s) {
  // only a confirmed write clears the queue flag — otherwise the background tick retries
  if (!cloudReady() || !navigator.onLine || !S.shoot || !S.shoot.syncKey) return false;
  try {
    await pushSubjectRows([subRow(s, S.shoot.syncKey)]);
    if (s.dirty) { delete s.dirty; await dbPut('subjects', s); }
    return true;
  } catch (e) { return false; }
}
/* subject deletions must reach the cloud, or live sync resurrects the deleted person */
async function cloudDeleteSubject(sid) {
  if (!cloudReady() || !S.shoot.syncKey) return;
  const q = await getMeta('cloudSubjDeletes', []);
  q.push({ k: S.shoot.syncKey, id: sid });
  await setMeta('cloudSubjDeletes', q);
  if (navigator.onLine) { try { await flushSubjectDeletes(); } catch (e) {} }
}
async function flushSubjectDeletes() {
  const q = await getMeta('cloudSubjDeletes', []);
  if (!q.length) return;
  const rest = [];
  for (const d of q) {
    try {
      await sbUpsert('md_subjects', 'shoot_key,id', [{ shoot_key: d.k, id: d.id, deleted: true, updated_at: nowISO() }]);
      const caps = (await sbJson(`/rest/v1/md_captures?shoot_key=eq.${d.k}&subject_id=eq.${encodeURIComponent(d.id)}&select=id`)) || [];
      for (const c of caps) {
        await sb('/rest/v1/md_captures?id=eq.' + encodeURIComponent(c.id), { method: 'DELETE' });
        await sb('/storage/v1/object/mdphotos/' + d.k + '/' + c.id + '.jpg', { method: 'DELETE' }).catch(() => {});
      }
      await sb(`/rest/v1/md_status?shoot_key=eq.${d.k}&subject_id=eq.${encodeURIComponent(d.id)}`, { method: 'DELETE' });
    } catch (e) { rest.push(d); }
  }
  await setMeta('cloudSubjDeletes', rest);
}
async function cloudPushShootMeta() {
  const key = S.shoot.syncKey;
  await flushSubjectDeletes();
  await cloudPushShootRow(S.shoot);
  if (S.shoot.metaDirty || S.shoot.colsDirty) { S.shoot.metaDirty = false; S.shoot.colsDirty = false; await dbPut('shoots', S.shoot); } // rename/archive/new field is now the cloud's copy too
  const subs = S.subjects.map(s => subRow(s, key));
  for (let i = 0; i < subs.length; i += 200) await pushSubjectRows(subs.slice(i, i + 200));
  for (const s of S.subjects) if (s.dirty) { delete s.dirty; await dbPut('subjects', s); } // the full-roster push settles every queued edit
  await repairOrphanSubjectRows().catch(() => {});
  const stats = [];
  for (const s of S.subjects) {
    const reg = myRegister(s);
    if (reg) stats.push({ shoot_key: key, subject_id: s.id, device_id: DEVICE.id, state: reg.state, ts: reg.ts, by_name: DEVICE.name || DEVICE.id });
  }
  for (let i = 0; i < stats.length; i += 300) await sbUpsert('md_status', 'shoot_key,subject_id,device_id', stats.slice(i, i + 300));
}
async function cloudPushCaptures(progress) {
  const key = S.shoot.syncKey;
  // retry queued deletions first (undone check-ins)
  const pend = await getMeta('cloudDeletes', []);
  for (const cid of pend.slice()) {
    try {
      await sb('/rest/v1/md_captures?id=eq.' + encodeURIComponent(cid), { method: 'DELETE' });
      await sb('/storage/v1/object/mdphotos/' + key + '/' + cid + '.jpg', { method: 'DELETE' }).catch(() => {});
      pend.splice(pend.indexOf(cid), 1);
    } catch (e) { break; }
  }
  await setMeta('cloudDeletes', pend);
  const myCaps = [...S.caps.values()].flat();
  const cloudIds = new Set(((await sbJson(`/rest/v1/md_captures?shoot_key=eq.${key}&select=id`)) || []).map(r => r.id));
  let up = 0, failed = 0;
  for (const c of myCaps) {
    if (cloudIds.has(c.id)) { await markUploaded(c); continue; } // already there — clear it from the backlog
    const st0 = S.R.get(c.subjectId);
    if (st0 && st0.state === 'out' && st0.ts > (Date.parse(c.takenAt) || 0)) continue; // undone — don't resurrect
    const rec = await dbGet('photos', c.id);
    if (!rec) continue;
    if (progress) progress(`Uploading photo ${up + 1}…`);
    try {
      await sb('/storage/v1/object/mdphotos/' + key + '/' + c.id + '.jpg', { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' }, body: rec.blob });
      await sbUpsert('md_captures', 'id', [{ id: c.id, shoot_key: key, subject_id: c.subjectId, taken_at: c.takenAt, device_id: c.deviceId, device_name: DEVICE.name || DEVICE.id }]);
      await markUploaded(c);
      up++;
    } catch (e) { failed++; } // keep going: one bad photo shouldn't strand the rest
  }
  return { up, failed };
}
async function cloudPull(progress) {
  const key = S.shoot.syncKey;
  // a rename on another phone comes down with the shoot row; a rename made HERE and not
  // yet pushed (metaDirty) wins, so an offline rename isn't undone by the next sync
  let renamed = '', newCols = 0;
  try {
    const meta = (await sbJson(`/rest/v1/md_shoots?sync_key=eq.${key}&select=*`)) || [];
    const m = meta[0];
    if (m) {
      if (!S.shoot.metaDirty) {
        let touched = false;
        if (m.name && m.name !== S.shoot.name) { S.shoot.name = m.name; renamed = m.name; touched = true; }
        if (m.shoot_date && m.shoot_date !== (S.shoot.shootDate || '')) { S.shoot.shootDate = m.shoot_date; touched = true; }
        if ('archived' in m && !!m.archived !== !!S.shoot.archived) { S.shoot.archived = !!m.archived; touched = true; }
        if (touched) await dbPut('shoots', S.shoot);
      }
      // v0.14.4: fields added on another phone. Always a union, never a replace — and if this
      // phone holds a field the cloud's list lacks, the cloud is owed it (the tick sends it).
      if (Array.isArray(m.columns)) {
        newCols = await adoptColumns(m.columns);
        const theirs = new Set(m.columns);
        if (!S.shoot.colsDirty && (S.shoot.columns || []).some(c => !theirs.has(c))) { S.shoot.colsDirty = true; await dbPut('shoots', S.shoot); }
      }
    }
  } catch (e) { /* not fatal — carry on with the roster pull */ }
  const subs = (await sbJson(`/rest/v1/md_subjects?shoot_key=eq.${key}&select=*`)) || [];
  let addSub = 0, remSub = 0, flagChanged = 0, editSub = 0;
  for (const ms of subs) {
    if (ms.deleted) {
      // this person was deleted on another device — remove them here too, never re-add
      const si = S.subjects.findIndex(x => x.id === ms.id);
      if (si >= 0) {
        const sub = S.subjects[si];
        for (const c of (S.caps.get(sub.id) || [])) { await dbDel('captures', c.id); await dbDel('photos', c.id); }
        S.caps.delete(sub.id);
        await dbDel('remote', S.shoot.id + '|' + sub.id);
        S.R.delete(sub.id);
        await subDel(S.shoot.id, sub.id);
        S.subjects.splice(si, 1);
        remSub++;
      }
      continue;
    }
    let s = S.subjects.find(x => x.id === ms.id);
    if (!s) {

/* ---------- backup ZIP merge: bring another phone's photos into this copy ---------- */
function readZip(file) {
  return file.arrayBuffer().then(ab => {
    const buf = new Uint8Array(ab);
    const dv = new DataView(ab);
    let e = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65558); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    }
    if (e < 0) throw new Error('Not a ZIP file');
    const count = dv.getUint16(e + 10, true);
    let off = dv.getUint32(e + 16, true);
    const entries = {};
    const td = new TextDecoder();
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nameLen = dv.getUint16(off + 28, true);
      const extraLen = dv.getUint16(off + 30, true);
      const cmtLen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const name = td.decode(buf.subarray(off + 46, off + 46 + nameLen));
      const lnl = dv.getUint16(lho + 26, true), lxl = dv.getUint16(lho + 28, true);
      const dataStart = lho + 30 + lnl + lxl;
      entries[name] = { method, data: buf.subarray(dataStart, dataStart + csize) };
      off += 46 + nameLen + extraLen + cmtLen;
    }
    return entries;
  });
}

    ${vals.map((v, i) => `<button class="btn" data-pdv="${i}" style="margin-bottom:8px">${esc(v)} <span style="opacity:.6">— ${countFor(v)} with photos</span></button>`).join('')}
    <button class="btn ghost" id="pdCancel" style="margin-top:6px">Cancel</button>`;
  document.body.append(bg, sheet);
  $('#pdCancel').onclick = close;
  $('#pdAll').onclick = async () => { close(); await doPhotoDayExport(); };
  sheet.querySelectorAll('[data-pdv]').forEach(b => b.onclick = async () => {
    const v = vals[+b.dataset.pdv];
    close();
    await doPhotoDayExport({ col, val: v });
  });
}
async function doPhotoDayExport(scope) {
  toast('Building PhotoDay export…');
  const m = pdColMap();
  const rows = [PD_HEADERS.slice()];
  const files = [];
  let skippedRemote = 0;
  const p2 = n => String(n).padStart(2, '0');
  const fmt = iso => { const d = new Date(iso); return `${p2(d.getMonth() + 1)}/${p2(d.getDate())}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
  const inScope = s => !scope || String((s.extra || {})[scope.col] || '').split(',').map(x => x.trim()).includes(scope.val);
  for (const s of S.subjects) {
    if (!inScope(s)) continue;
    const caps = S.caps.get(s.id) || [];
    if (!caps.length) {
      if ((S.R.get(s.id) || {}).state === 'in') skippedRemote++; // their photo lives on another phone
      continue;
    }
    const cap = caps[caps.length - 1]; // latest photo is the reference
    const rec = await dbGet('photos', cap.id);
    if (!rec) continue;
    // re-scale to PhotoDay-like reference size (max 800px edge) to keep the zip phone-friendly
    const img = new Image();
    const u = URL.createObjectURL(rec.blob);
    try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = u; }); }
    catch (e) { URL.revokeObjectURL(u); continue; }
    const blob = await scaleBlob(img, img.naturalWidth, img.naturalHeight, 800, 0.85);
    URL.revokeObjectURL(u);
    const fname = `${safeName(s.last)}_${safeName(s.first)}_${s.id.slice(0, 6)}.jpg`;
    files.push({ name: fname, data: blob });
    const g = k => m[k] ? String((s.extra || {})[m[k]] || '') : '';
    rows.push([
      fname, g('Access Code'), g('Student ID') || (s.first + ' ' + s.last).trim(), g('Grade'),
      s.last, s.first, g('Period'), g('Email'), g('Email 2'), g('Mobile Phone'), g('Team'),
      fmt(cap.takenAt), '', g('Other'), s.added ? 'capture' : 'studio'
    ]);
  }
  if (files.length === 0) return toast(scope ? `No photographed ${scope.val} subjects on this device` : 'No photographed subjects on this phone yet');
  files.unshift({ name: 'Index.csv', data: toCSV(rows) + '\r\n' });
  const zip = await Zip.build(files);
  const zname = `PhotoDay_${safeName(S.shoot.name)}${scope ? '_' + safeName(scope.val) : ''}_${safeName(DEVICE.name || DEVICE.id)}_${new Date().toISOString().slice(0, 10)}.zip`;
  await deliverZip(zip, zname, false);
  toast(`PhotoDay export${scope ? ' — ' + scope.val : ''}: ${files.length - 1} subjects ✓${skippedRemote ? ` (${skippedRemote} are on other phones/devices)` : ''}`, true);
}
/* ---------- sync check: why don't our phones agree? -------------------------
   Three devices and a browser can each hold a different slice of a shoot, and
   until now the only way to compare them was counting rows by eye. This screen
   asks the cloud directly and names every reason something hasn't come down or
   gone up from THIS device — including the silent skips (a person held by
   another job on this phone, a photo whose file is missing from storage, an
   undo outvoting a capture). Run it on each device; the odd one out confesses. */
async function syncCheckSheet() {
  if (!cloudReady()) return toast('Set up Cloud Sync in Settings first');
  if (!S.shoot.syncKey) return toast('This job has no sync key — it never came from a CSV import or share');
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.style.maxHeight = '80vh'; sheet.style.overflowY = 'auto';
  const close = trackSheet(bg, sheet);
  bg.onclick = close;
  sheet.innerHTML = `<h3>Sync check</h3><div id="scBody" style="font-size:13.5px;line-height:1.55;color:var(--text)">Asking the cloud…</div>
    <button class="btn primary" id="scSync" style="margin-top:14px">Cloud Sync now</button>
    <button class="btn ghost" id="scClose" style="margin-top:10px">Close</button>`;
  document.body.append(bg, sheet);
  $('#scClose').onclick = close;
  $('#scSync').onclick = async () => { close(); await cloudSyncNow(); };
  const L = [];
  const ok = t => `<div style="color:var(--good);margin-top:6px">✓ ${t}</div>`;
  const warn = t => `<div style="color:var(--accent2);margin-top:6px">⚠ ${t}</div>`;
  const bad = t => `<div style="color:var(--bad);margin-top:6px">✕ ${t}</div>`;
  const dim = t => `<div style="color:var(--dim);margin-top:6px">${t}</div>`;
  try {
    const key = S.shoot.syncKey;
    // schema probe: if the database is missing the v0.10 columns, EVERY roster push is
    // being rejected while photos sail through — say so before anything else
    let schemaOk = true;
    try { await sbJson('/rest/v1/md_subjects?select=flag,flag_ts,deleted&limit=1'); }
    catch (e) {
      schemaOk = false;
      L.push(bad(`<b>Your cloud database is missing an update</b> — people can't be sent to the cloud at all (photos still can, which is why counts drift apart). Fix: supabase.com → your project → SQL Editor → run the three lines in MIGRATION_v0.10.sql (it's in the app download). Two minutes, then Cloud Sync everywhere.`));
    }
    try { await sbJson('/rest/v1/md_shoots?select=archived&limit=1'); }
    catch (e) {
      L.push(bad(`<b>The archive feature needs a one-line database update</b> — archiving works on this phone but won't reach the others until it runs. Fix: supabase.com → SQL Editor → run MIGRATION_v0.12.sql (in the app download).`));
    }
    try { await sbJson('/rest/v1/md_subjects?select=added_at,added_by&limit=1'); }
    catch (e) {
      L.push(bad(`<b>"Added by / added when" needs a one-line database update</b> — the app records it on this device but it won't travel to the others until it runs. Everything else keeps syncing meanwhile. Fix: supabase.com → SQL Editor → run MIGRATION_v0.14.sql (in the app download).`));
    }
    /* The re-key itself is a LOCAL store change — no SQL to run. But if the re-key didn't complete
       (another tab was holding the old database open), people can still be held back, so
       say so rather than leave it looking like a cloud problem. */
    try {
      const ldb = await openDB();
      if (!Array.isArray(ldb.transaction('subjects').objectStore('subjects').keyPath)) {
        L.push(bad(`<b>This device's local database didn't finish updating to v0.14</b> — people who appear in two jobs here can still be held back. Fix: close every MatchDay tab/window on this device, then open it once more. No SQL, nothing to re-download.`));
      } else {
        const up = await getMeta('dbUpgrade', null);
        if (up) L.push(dim(`Local database re-keyed for v0.14 — ${up.kept} people carried over${up.dropped ? `, ${up.dropped} row(s) that belonged to no job dropped` : ''}.`));
      }
    } catch (e) { /* probe only — never block the rest of the report */ }
    const cSubs = (await sbJson(`/rest/v1/md_subjects?shoot_key=eq.${key}&select=` + (schemaOk ? 'id,first_name,last_name,deleted' : 'id,first_name,last_name'))) || [];
    const cCaps = (await sbJson(`/rest/v1/md_captures?shoot_key=eq.${key}&select=id,subject_id,device_name,taken_at`)) || [];
    const liveSubs = cSubs.filter(r => !r.deleted);
    const localCaps = [...S.caps.values()].flat();
    const localCapIds = new Set(localCaps.map(c => c.id));
    const localIds = new Set(S.subjects.map(x => x.id));
    const byDev = {};
    for (const c of cCaps) byDev[c.device_name || '?'] = (byDev[c.device_name || '?'] || 0) + 1;
    L.push(dim(`<b style="color:var(--text)">${esc(S.shoot.name)}</b> — key <code>${key}</code> — app v${VERSION} — this device: ${esc(DEVICE.name || DEVICE.id)}`));
    L.push(dim(`This device: <b>${S.subjects.length}</b> people, <b>${localCaps.length}</b> photos. Cloud: <b>${liveSubs.length}</b> people, <b>${cCaps.length}</b> photos (${Object.entries(byDev).map(([d, n]) => esc(d) + ': ' + n).join(' • ') || 'none'}).`));

    // ---- people the cloud has that this device doesn't
    // (before v0.14.0 this is where "held back" appeared: anyone whose id another job on
    //  this device already held was skipped for good. The re-key removed that condition.)
    const missSubs = liveSubs.filter(r => !localIds.has(r.id));
    if (missSubs.length) {
      const nm = r => esc(((r.first_name || '') + ' ' + (r.last_name || '')).trim() || 'unnamed');
      L.push(warn(`${missSubs.length} people haven't come down yet (${missSubs.slice(0, 5).map(nm).join(', ')}${missSubs.length > 5 ? '…' : ''}) — “Cloud Sync now” brings them and their photos.`));
    } else L.push(ok('Everyone in the cloud is on this device.'));

    // ---- photos the cloud has that this device doesn't, and why
    const missCaps = cCaps.filter(c => !localCapIds.has(c.id));
    const cloudSubjIds = new Set(cSubs.map(r => r.id));
    if (missCaps.length) {
      let noSubj = 0, undone = 0;
      const orphanBy = {};
      const testable = [];
      for (const c of missCaps) {
        if (!cloudSubjIds.has(c.subject_id)) { orphanBy[c.device_name || 'unknown phone'] = (orphanBy[c.device_name || 'unknown phone'] || 0) + 1; continue; }
        if (!localIds.has(c.subject_id)) { noSubj++; continue; }
        const st = S.R.get(c.subject_id);
        if (st && st.state === 'out' && st.ts > (Date.parse(c.taken_at) || 0)) { undone++; continue; }
        testable.push(c);
      }
      let broken = 0, healthy = 0;
      for (const c of testable.slice(0, 4)) { // sample the actual files in storage
        try { const r = await sb('/storage/v1/object/mdphotos/' + key + '/' + c.id + '.jpg'); (r.ok ? healthy++ : broken++); }
        catch (e) { broken++; }
      }
      L.push(warn(`<b>${missCaps.length} photos are in the cloud but not on this device.</b>`));
      const orphanN = Object.values(orphanBy).reduce((a, b) => a + b, 0);
      if (orphanN) L.push(bad(`${orphanN} belong to people whose NAMES never reached the cloud — walk-ups added on ${Object.keys(orphanBy).map(esc).join(' and ')}. Fix: on that phone, open this job and tap Cloud Sync now (v0.11.2+ sends them automatically). The photos come down everywhere once the names are up.`));
      if (noSubj) L.push(warn(`${noSubj} belong to people this device hasn't pulled yet — they arrive with the same sync.`));
      if (undone) L.push(dim(`${undone} skipped because this device has an undo for that person (deliberate).`));
      if (broken) L.push(bad(`${broken} of ${Math.min(testable.length, 4)} sampled photo files are missing or unreadable in cloud storage — the record uploaded but the picture didn't. The phone that took them must Cloud Sync again to re-send.`));
      if (healthy && !broken) L.push(ok(`Sampled photo files are healthy — “Cloud Sync now” below should fetch the rest.`));
    } else L.push(ok('Every cloud photo is on this device.'));

    // ---- photos on this device whose person this JOB doesn't have (trapped in another job)
    const haveLocal = new Set(S.subjects.map(x => x.id));
    const trapped = new Map();
    for (const c of localCaps) {
      if (haveLocal.has(c.subjectId) || trapped.has(c.subjectId)) continue;
      const owner = (await subAnywhere(c.subjectId))[0];
      if (owner) {
        const oj = await dbGet('shoots', owner.shootId);
        trapped.set(c.subjectId, { name: displayName(owner), job: oj ? oj.name : 'a job no longer here' });
      } else trapped.set(c.subjectId, null);
    }
    const trappedFound = [...trapped.values()].filter(Boolean);
    const trappedLost = [...trapped.values()].filter(x => !x).length;
    if (trappedFound.length) L.push(warn(`${trappedFound.length} of this phone's photographed people aren't in this job — their records sit in ${[...new Set(trappedFound.map(t => '“' + esc(t.job) + '”'))].join(', ')} on this phone (${trappedFound.slice(0, 5).map(t => esc(t.name)).join(', ')}${trappedFound.length > 5 ? '…' : ''}). This app now pushes their names to the cloud automatically so other phones can attach the photos.`));
    if (trappedLost) L.push(bad(`${trappedLost} photographed people exist in NO job on this phone — their photos can't be named anywhere. Export a backup ZIP and send it to Bill/Claude.`));
    // ---- people on this device the cloud has never heard of (this phone owes them)
    const owedSubs = S.subjects.filter(x => !cloudSubjIds.has(x.id));
    if (owedSubs.length) L.push(warn(`${owedSubs.length} people on this device aren't in the cloud yet (${owedSubs.slice(0, 5).map(x => esc(displayName(x))).join(', ')}${owedSubs.length > 5 ? '…' : ''}) — Cloud Sync now sends them, and their photos become visible to the other phones.`));
    // ---- what this device still owes the cloud
    const pendUp = pendingUploads().length;
    const pendSub = pendingSubjects().length;
    if (pendUp || pendSub) L.push(warn(`This device still owes the cloud ${pendUp ? pendUp + ' photo(s)' : ''}${pendUp && pendSub ? ' and ' : ''}${pendSub ? pendSub + ' people/edits' : ''} — keep it online.`));
    else L.push(ok('Nothing waiting to upload from this device.'));

    // ---- local photos the cloud lacks that AREN'T queued (took them before v0.11, or another device's copy)
    const cloudIdSet = new Set(cCaps.map(c => c.id));
    const strandedMine = localCaps.filter(c => c.deviceId === DEVICE.id && !cloudIdSet.has(c.id) && c.up);
    if (strandedMine.length) L.push(bad(`${strandedMine.length} of this device's photos are marked uploaded but the cloud doesn't have them — tap Cloud Sync now to re-send.`));

    if (!L.some(x => x.includes('✕')) && !L.some(x => x.includes('⚠'))) L.push(ok('<b>This device fully matches the cloud.</b> If another device disagrees, run Sync check there.'));
  } catch (e) {
    L.push(bad('Could not reach the cloud: ' + esc(e.message)));
  }
  const body = $('#scBody');
  if (body) body.innerHTML = L.join('');
}

/* ---------- who we missed: the end-of-day conversation with the school ---------- */
function missingReport() {
  const missing = S.subjects.filter(s => !isDone(s));
  const groups = { absent: [], gone: [], unknown: [] };
  for (const s of missing) (groups[flagOf(s) || 'unknown']).push(s);
  return { missing, ...groups };
}

  const r = missingReport();

      <button class="btn" id="mrCsv" style="margin-bottom:10px">Download list as CSV</button>` : ''}

    <button class="btn ghost" id="mrCancel">Close</button>`;

  };
  const ms = $('#mrShare');

    downloadBlob(new Blob([text], { type: 'text/plain' }), `WhoWeMissed_${safeName(S.shoot.name)}.txt`);
  };
  const mc = $('#mrCsv');
  if (mc) mc.onclick = () => {

    close();
    downloadBlob(new Blob([toCSV(rows)], { type: 'text/csv' }), `WhoWeMissed_${safeName(S.shoot.name)}.csv`);

}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function doExport(share) {
  toast('Building export…');
  const sh = S.shoot;
  const cols = sh.columns || [];
  const rows = [['MatchDay ID', 'First Name', 'Last Name', ...cols, 'Photo Count', 'Checked In On', 'Status', 'Handled', 'Added On Site', 'Added When', 'Added By', 'Reached This Device Via']];
  const files = [];
  const captures = [];
  for (const s of S.subjects) {
    const caps = S.caps.get(s.id) || [];
    const st = S.R.get(s.id);
    const where = caps.length ? (DEVICE.name || 'this phone') : (st && st.state === 'in') ? (st.by || 'other phone') : '';
    const status = caps.length || (st && st.state === 'in') ? 'photographed' : flagOf(s) ? FLAGS[flagOf(s)].label : '';
    rows.push([s.id, s.first, s.last, ...cols.map(c => (s.extra || {})[c] || ''), caps.length, where, status, s.handled ? 'yes' : '', s.added ? 'yes' : '', s.addedAt || '', s.addedBy || '', arrivedVia(s)]);
    let n = 0;
    for (const c of caps) {
      n++;
      const rec = await dbGet('photos', c.id);
      if (!rec) continue;
      const fname = `photos/${safeName(s.last)}_${safeName(s.first)}_${s.id.slice(0, 8)}_${n}.jpg`;
      files.push({ name: fname, data: rec.blob });
      captures.push({ id: c.id, subjectId: s.id, file: fname, takenAt: c.takenAt, deviceId: c.deviceId });
    }
  }
  const manifest = {
    app: 'MatchDay', version: VERSION, exportedAt: nowISO(),
    device: { id: DEVICE.id, name: DEVICE.name },
    shoot: { id: sh.id, name: sh.name, createdAt: sh.createdAt, columns: cols, syncKey: sh.syncKey || '' },
    subjects: S.subjects,
    captures,
    statusRegisters: [...S.R.entries()].map(([subjectId, r]) => ({ subjectId, state: r.state, ts: r.ts, by: r.by }))
  };
  files.unshift(
    { name: 'roster.csv', data: toCSV(rows) },
    { name: 'checkins.json', data: JSON.stringify(manifest, null, 2) }
  );
  const zip = await Zip.build(files);
  const dstr = new Date().toISOString().slice(0, 10);
  const zname = `MatchDay_${safeName(sh.name)}_${safeName(DEVICE.name || DEVICE.id)}_${dstr}.zip`;
  if (share) {
    const file = new File([zip], zname, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: zname }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zip);
  a.download = zname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  toast('Export ready ✓', true);
}

        <input type="text" id="cUrl" placeholder="https://xxxx.supabase.co" value="${esc((CLOUD || {}).url || '')}">
        <label class="f">Anon (public) API key</label>
        <input type="text" id="cAnon" placeholder="eyJhbGciOi…" value="${esc((CLOUD || {}).anon || '')}">
        <label class="f">Team email</label>
        <input type="text" id="cEmail" placeholder="sync@yourdomain.com" value="${esc((CLOUD || {}).email || '')}">
        <label class="f">Password (used once to sign in; not stored)</label>
        <input type="text" id="cPass" placeholder="password">
        <button class="btn primary" id="cConnect" style="margin-top:12px">${cloudReady() ? 'Reconnect' : 'Connect'}</button>
        ${cloudReady() ? `<div class="row" style="margin-top:8px">
          <button class="btn" id="cShare">Share setup (QR)</button>
          <button class="btn danger ghost" id="cForget">Disconnect</button>
        </div>` : `<button class="btn" id="cScan" style="margin-top:8px">Scan setup from other phone</button>`}
      </div>
      <div class="card">
        <h3>Tips</h3>
        <div class="meta" style="line-height:1.6">
          • Install to your home screen (browser menu → “Add to Home Screen”) — required for reliable offline use.<br>
          • Load the roster CSV <b>before</b> leaving for the shoot.<br>
          • Export the ZIP after every shoot as your backup.
        </div>
      </div>
    </div>`;
  $('#saveDev').onclick = async () => {
    DEVICE.name = $('#devName').value.trim();
    await setMeta('deviceName', DEVICE.name);
    toast('Saved', true);
  };
  $('#cConnect').onclick = async () => {
    const url = $('#cUrl').value.trim(), anon = $('#cAnon').value.trim(), email = $('#cEmail').value.trim(), pass = $('#cPass').value;
    if (!url || !anon || !email || !pass) return toast('Fill in all four cloud fields');
    try {
      toast('Connecting…');
      await cloudSignIn(url, anon, email, pass);
      toast('Cloud connected ✓', true);
      scheduleAutoSync();
      renderSettings();
    } catch (e) { toast('Cloud: ' + e.message); }
  };
  const cf = $('#cForget');
  if (cf) cf.onclick = async () => {
    if (!confirm('Disconnect Cloud Sync on this phone? (Nothing in the cloud is deleted.)')) return;
    CLOUD = null;
    await setMeta('cloud', null);
    renderSettings();
  };
  const cs = $('#cShare');
  if (cs) cs.onclick = async () => {
    await loadScript('qrcode.js');
    const raw = new TextEncoder().encode(JSON.stringify({ u: CLOUD.url, a: CLOUD.anon, e: CLOUD.email }));
    const payload = ('CompressionStream' in window) ? 'z' + b64uEnc(await deflate(raw)) : 'j' + b64uEnc(raw);
    showQRParts(payload, 'MDC1', 'Cloud setup', 'Other phone: Settings → "Scan setup from other phone", then enter the password and Connect.');
  };
  const csc = $('#cScan');
  if (csc) csc.onclick = () => scanSyncCode();
}

/* ---------- boot ---------- */
(async function boot() {
  await initDevice();
  await loadCloud();
  if (cloudReady()) scheduleAutoSync();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      // when a NEW version replaces a running one, restart once to pick it up
      // (first-ever install also fires updatefound — no reload for that)
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw || !hadController) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'activated') {
            if (location.hash.startsWith('#/capture/')) { toast('Update ready — reopen the app when done'); return; }
            toast('Updating MatchDay…', true);
            setTimeout(() => location.reload(), 900);
          }
        });
      });
    }).catch(e => console.warn('SW failed', e));
  }
  route();
})();
</script>
</body>
</html>
