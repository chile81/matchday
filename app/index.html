<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MatchDay</title>
<style>
:root{
  --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2a3340;
  --text:#eef2f6; --dim:#93a1b0; --accent:#ff7a3d; --accent2:#ffb64d;
  --good:#3ecf8e; --bad:#ff5d5d;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100%; overscroll-behavior:none;}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(14,17,22,.98),rgba(14,17,22,.92));
  backdrop-filter:blur(8px);padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);}
.header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header .sub{font-size:12px;color:var(--dim);font-weight:400;display:block;}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;font-size:18px;}
.iconbtn:active{background:var(--line);}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.brand{font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.content{flex:1;padding:14px;padding-bottom:calc(24px + var(--safe-bot));}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;}
.btn:active{opacity:.8;}
.btn.primary{background:linear-gradient(135deg,var(--accent),#ff5e3a);border:none;color:#fff;box-shadow:0 4px 18px rgba(255,110,60,.25);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--bad);border-color:rgba(255,93,93,.4);}
.btn:disabled{opacity:.4;pointer-events:none;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
.card h3{margin:0 0 6px;font-size:16px;}
.card .meta{color:var(--dim);font-size:13px;}
input[type=text],input[type=search],select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:16px;outline:none;appearance:none;}
input:focus{border-color:var(--accent);}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.searchbar{position:sticky;top:calc(61px + var(--safe-top));z-index:19;background:var(--bg);padding:10px 14px 8px;}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch;align-items:center;}
.filters select{width:auto;min-width:110px;padding:8px 10px;font-size:13px;border-radius:20px;flex:none;}
.seg{display:flex;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.segb{border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:600;padding:8px 13px;cursor:pointer;}
.segb.on{background:linear-gradient(135deg,var(--accent),#ff5e3a);color:#fff;}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;margin:12px auto;max-width:340px;}
.qrbox img{width:100%;image-rendering:pixelated;}
.wrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;}
.wcheck{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;font-size:18px;}
.wcheck.on{background:var(--good);border-color:var(--good);color:#06281a;font-weight:800;}
.chip{display:inline-block;padding:7px 14px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13.5px;margin:0 6px 8px 0;cursor:pointer;}
.chip.on{background:linear-gradient(135deg,var(--accent),#ff5e3a);border-color:transparent;color:#fff;font-weight:600;}
.chip.sm{padding:6px 12px;font-size:13px;margin:0 6px 6px 0;}
.chiprow{display:flex;flex-wrap:wrap;margin-top:8px;}
.fhint{font-size:12px;color:var(--dim);margin:2px 2px 0;}
.subject{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer;}
.subject.done{border-color:rgba(62,207,142,.45);}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--panel2);flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:700;color:var(--dim);font-size:15px;overflow:hidden;position:relative;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar .badge{position:absolute;right:-4px;bottom:-4px;background:var(--good);color:#06281a;border-radius:9px;
  font-size:10px;font-weight:800;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.sinfo{flex:1;min-width:0;}
.sname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* v0.14.3: "No longer there" reads at a glance — name struck through, row dimmed */
.nm.gone{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--dim);color:var(--dim);}
.subject.gone,.wurow.gone,.wrow.gone{opacity:.62;}
/* v0.14.3: Save never jumps out from under a thumb when the keyboard closes */
.savebar{position:sticky;bottom:calc(10px + var(--safe-bot));z-index:6;}
.savebar .btn[disabled]{opacity:.6;}
.sextra{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.camb{width:46px;height:46px;border-radius:12px;flex:none;background:var(--panel2);border:1px solid var(--line);
  color:var(--accent2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.camb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.count{color:var(--dim);font-size:13px;padding:4px 14px 10px;}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:15px;line-height:1.5;}
.progress{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s;}
/* capture */
.cap{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;}
.cap video{flex:1;object-fit:cover;width:100%;min-height:0;}
.capTop{position:absolute;top:0;left:0;right:0;padding:calc(12px + var(--safe-top)) 14px 30px;
  background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);display:flex;align-items:center;gap:10px;z-index:2;}
.capName{flex:1;font-size:20px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.capName small{display:block;font-size:12.5px;color:#ffd9a8;font-weight:500;}
.capBottom{position:absolute;left:0;right:0;bottom:0;padding:20px 20px calc(26px + var(--safe-bot));
  background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);display:flex;align-items:center;justify-content:space-between;z-index:2;}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;}
.shutter:active{background:var(--accent);}
.capThumb{width:52px;height:52px;border-radius:10px;border:2px solid #fff5;overflow:hidden;background:#111;}
.capThumb img{width:100%;height:100%;object-fit:cover;}
.flash{position:fixed;inset:0;background:#fff;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;}
.flash.on{opacity:.9;transition:none;}
/* photo grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.grid .ph{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;background:var(--panel2);border:1px solid var(--line);}
.grid .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.grid .ph .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:8px;
  width:26px;height:26px;font-size:14px;cursor:pointer;}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:70;display:flex;align-items:center;justify-content:center;}
.viewer img{max-width:100%;max-height:100%;}
.toast{position:fixed;bottom:calc(30px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 20px;border-radius:24px;
  font-size:14.5px;font-weight:600;z-index:80;opacity:0;transition:all .25s;box-shadow:0 6px 24px rgba(0,0,0,.5);
  white-space:nowrap;pointer-events:none;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.good{border-color:rgba(62,207,142,.6);}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:20px 20px 0 0;
  border:1px solid var(--line);padding:18px 16px calc(20px + var(--safe-bot));max-width:640px;margin:0 auto;
  max-height:calc(88vh - var(--safe-top));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.sheet h3{margin:0 0 14px;font-size:17px;}
.hidden{display:none !important;}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:2px 8px;font-size:12px;color:var(--dim);margin:2px 4px 2px 0;}
a{color:var(--accent2);}
</style>
</head>
<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<input type="file" id="csvInput" accept=".csv,text/csv" class="hidden">
<input type="file" id="zipInput" accept=".zip,application/zip" class="hidden">
<input type="file" id="camFallback" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galleryInput" accept="image/*" class="hidden">

<script>
'use strict';
/* ============================================================
   MatchDay v0.1 — offline roster check-in & reference capture
   Vibrant Valley Photography
   ============================================================ */
const VERSION = '0.14.4';

/* ---------- tiny helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const nowISO = () => new Date().toISOString();
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
/* shoot-date helpers: dates are plain YYYY-MM-DD strings, parsed at noon to dodge timezone edges */
const dateTs = d => d ? Date.parse(d + 'T12:00:00') : null;
function todayYMD() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dateLabel(d) {
  const ts = dateTs(d);
  if (!ts) return '';
  const days = Math.round((ts - dateTs(todayYMD())) / 86400000);
  const nice = new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  if (days === 0) return nice + ' • TODAY';
  if (days === 1) return nice + ' • tomorrow';
  if (days > 1) return nice + ` • in ${days} days`;
  if (days === -1) return nice + ' • yesterday';
  return nice + ` • ${-days} days ago`;
}
/* order: next upcoming first, rest of the future after, past shoots below (most recent first), undated last */
function sortShoots(shoots) {
  const t0 = dateTs(todayYMD());
  const rank = sh => {
    const ts = dateTs(sh.shootDate);
    if (ts === null) return [2, -(Date.parse(sh.createdAt) || 0)];
    return ts >= t0 ? [0, ts] : [1, -ts];
  };
  return shoots.sort((a, b) => {
    const ra = rank(a), rb = rank(b);
    return ra[0] - rb[0] || ra[1] - rb[1];
  });
}
const safeName = s => String(s ?? '').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'x';

/* deterministic key: same input string → same 16-hex id on every phone */
async function detKey(str) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(h).slice(0, 8)].map(b => b.toString(16).padStart(2, '0')).join('');
}
/* base64url + deflate for QR payloads */
const b64uEnc = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function b64uDec(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function deflate(u8) {
  const cs = new CompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
async function inflate(u8) {
  const ds = new DecompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
}
const _loaded = {};
function loadScript(src) {
  if (_loaded[src]) return _loaded[src];
  _loaded[src] = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('load failed: ' + src));
    document.head.appendChild(sc);
  });
  return _loaded[src];
}

let toastTimer = null;
function toast(msg, good) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (good ? ' good' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}
function flash() {
  const f = $('#flash');
  f.classList.add('on');
  requestAnimationFrame(() => setTimeout(() => f.classList.remove('on'), 60));
}

const ICONS = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  cam: '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  add: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  addPerson: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>',
  out: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  flip: '<svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10"/><path d="M3.51 15a9 9 0 0014.85 3.36L23 14"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>',
  qr: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 14v3M14 21h3M21 21h.01"/></svg>',
  gallery: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
};

/* ---------- IndexedDB ---------- */
const DB_NAME = 'matchday', DB_VER = 3;
let _db = null;
/* set by the v3 re-key so Sync check can report what it did (also persisted to meta) */
let DB_UPGRADE = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = ev => {
      const db = r.result, tr = r.transaction, old = ev.oldVersion || 0;
      if (!db.objectStoreNames.contains('shoots')) {
        db.createObjectStore('shoots', { keyPath: 'id' });
        // keyed by BOTH job and person: the same person key may legitimately appear in
        // more than one job on this device, exactly as it may in the cloud
        const s = db.createObjectStore('subjects', { keyPath: ['shootId', 'id'] });
        s.createIndex('shootId', 'shootId');
        s.createIndex('sid', 'id');        // the same person key across every job
        const c = db.createObjectStore('captures', { keyPath: 'id' });
        c.createIndex('shootId', 'shootId');
        c.createIndex('subjectId', 'subjectId');
        db.createObjectStore('photos', { keyPath: 'id' });
        db.createObjectStore('meta', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('remote')) {
        // check-ins learned from other phones via sync (no photo, just status)
        const rm = db.createObjectStore('remote', { keyPath: 'id' });
        rm.createIndex('shootId', 'shootId');
      }
      /* v0.14.0 re-key. Until now `subjects` was keyed by person id ALONE while the cloud
         has always keyed (shoot_key, id). So one person key could exist in only ONE job
         per device: whichever job loaded it first owned it, and a later job holding that
         same person was silently held back at sync — their photos with them. Everything
         downstream (the altSig re-hash, the applySync alias, the import salt, the
         cloudPull skip) was a workaround for this one line. Rows are rewritten in place;
         nothing re-downloads and no photo is touched. */
      if (old >= 1 && old < 3 && db.objectStoreNames.contains('subjects')) {
        const cur = tr.objectStore('subjects');
        if (!Array.isArray(cur.keyPath)) {
          const all = cur.getAll();
          all.onsuccess = () => {
            const rows = all.result || [];
            db.deleteObjectStore('subjects');
            const s2 = db.createObjectStore('subjects', { keyPath: ['shootId', 'id'] });
            s2.createIndex('shootId', 'shootId');
            s2.createIndex('sid', 'id');
            let kept = 0, dropped = 0;
            for (const row of rows) {
              // a row with no shootId was already unreachable — it belonged to no job
              if (!row || !row.shootId || !row.id) { dropped++; continue; }
              s2.put(row); kept++;
            }
            DB_UPGRADE = { from: old, kept, dropped, at: new Date().toISOString() };
            try { tr.objectStore('meta').put({ key: 'dbUpgrade', value: DB_UPGRADE }); } catch (e) {}
          };
        }
      }
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out._v !== undefined ? out._v : undefined);
    t.onerror = () => rej(t.error);
  }));
}
const dbPut = (store, val) => tx(store, 'readwrite', os => { os.put(val); });
const dbDel = (store, key) => tx(store, 'readwrite', os => { os.delete(key); });
function dbGet(store, key) {
  return openDB().then(db => new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function dbAll(store, indexName, key) {

function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // BOM
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch !== '\r') cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

const Zip = (() => {
  let T = null;
  function table() {
    if (T) return T;
    T = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;

  }

    const t = table(); let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

    const enc = new TextEncoder();

    let offset = 0;
    const d = new Date();
    const dtime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const ddate = (((d.getFullYear() - 1980) & 0x7f) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const u8 = f.data instanceof Uint8Array ? f.data
        : typeof f.data === 'string' ? enc.encode(f.data)
        : new Uint8Array(await f.data.arrayBuffer());
      const name = enc.encode(f.name);
      const crc = crc32(u8);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, u8.length, true); lh.setUint32(22, u8.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, u8);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dtime, true);
      ch.setUint16(14, ddate, true); ch.setUint32(16, crc, true); ch.setUint32(20, u8.length, true);
      ch.setUint32(24, u8.length, true); ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);

    for (const c of central) cdSize += c.byteLength;

    end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

})();

/* ---------- bottom sheets vs the phone's back button --------------------
   Sheets are overlays, not pages — but on a phone, back means "close this".
   Every sheet registers here and pushes one history entry; pressing back pops
   that entry and closes the sheet, leaving the page underneath untouched.

   on top of everything: the app looked frozen and had to be killed. */

  return () => { // programmatic close (Cancel, backdrop, an action button)

async function archiveFlow() {

    await setArchived(sh, false);
    return route();
  }
  const owedPhotos = pendingUploads().length;
  const owedPeople = pendingSubjects().length;
  if (owedPhotos || owedPeople) {
    const go = await askChoice('This phone still owes the cloud',
      `${owedPhotos ? owedPhotos + ' photo(s)' : ''}${owedPhotos && owedPeople ? ' and ' : ''}${owedPeople ? owedPeople + ' people/edits' : ''} from this job haven't reached the cloud yet. Archiving is the moment things get forgotten — sync first.`,
      [{ key: 'sync', label: 'Cloud Sync now, then decide', primary: true }, { key: 'anyway', label: 'Archive anyway (not recommended)' }]);
    if (!go) return;

  }
  if (!confirm(`Archive “${sh.name}”?\n\nIt moves under “Archived” on every phone. Nothing is deleted, and you can restore it anytime.`)) return;
  await setArchived(sh, true);
  // storage reclaim — only when the cloud PROVABLY holds every photo this phone has
  if (cloudReady() && navigator.onLine && sh.syncKey) {
    try {
      const cloudIds = new Set(((await sbJson(`/rest/v1/md_captures?shoot_key=eq.${sh.syncKey}&select=id`)) || []).map(r => r.id));
      const localCaps = [...S.caps.values()].flat();
      const heldHere = [];
      for (const c of localCaps) {
        if (!cloudIds.has(c.id)) { heldHere.length = 0; break; } // anything not in the cloud → no offer
        if (await dbGet('photos', c.id)) heldHere.push(c.id);
      }
      if (heldHere.length) {
        const free = await askChoice('Free up space on this phone?',
          `The cloud has all ${localCaps.length} of this job's photos. Remove the ${heldHere.length} full-size cop${heldHere.length === 1 ? 'y' : 'ies'} stored on this phone? Thumbnails and the roster stay, and any photo re-downloads from the cloud when you open it.`,

        if (free === 'free') {

          toast(`Freed up ${heldHere.length} photos — the cloud keeps them all`, true);

}

        (fresh ? `<br><br>Adding them keeps that job's photos and check-ins exactly as they are.` : '') +
        `<br><br>A separate job keeps its own photos and check-ins and can't disturb the other one. Send it to the other phone with “Share whole shoot” rather than importing this file there too.`;
      const choice = await askChoice(title, body,

        S.pendingCSV = null;
        if (!await loadShoot(ownerId)) return nav('/');
        for (const h of shoot.columns) if (!(S.shoot.columns || []).includes(h)) { S.shoot.columns = [...(S.shoot.columns || []), h]; S.shoot.metaDirty = true; }
        await dbPut('shoots', S.shoot);

        if (!f) return nav('/shoot/' + ownerId);

/* ---------- roster ---------- */
function filterableColumns() {
  const cols = [];
  for (const col of (S.shoot.columns || [])) {
    const vals = new Set();
    for (const s of S.subjects) {
      String((s.extra || {})[col] || '').split(',').map(v => v.trim()).filter(Boolean).forEach(v => vals.add(v));
    }
    // a useful grouping column has few repeated values; near-unique columns (IDs, emails,
    // filenames) make useless filters and are excluded
    if (vals.size >= 2 && vals.size <= 40 && vals.size <= Math.max(2, S.subjects.length * 0.5)) {
      cols.push([col, [...vals].sort((a, b) => norm(a).localeCompare(norm(b)))]);
    }
  }
  return cols;
}
const TEAMISH = ['team', 'group', 'class', 'teacher', 'homeroom', 'division', 'sport', 'sporttype', 'grade', 'school'];
/* ---------- folding a roster file into a job that already has people ----------
   A football CSV and a cross-country CSV both list the kid who does both. Row-for-row
   they differ (Team cell), so before v0.13 he landed on the roster twice — one check-in
   photo, one row forever "missing", and the matcher filing his cross-country pictures
   under Football. Now a new row whose NAME is already on the roster is offered as the
   same person: their team cell becomes "Football, Cross Country". Same name on the
   same team is left to the human — schools do have two kids called Joe Smith. */
const MERGE_COLS = /team|squad|sport|activity|club|group|division|period/;
const splitVals = v => String(v || '').split(',').map(x => x.trim()).filter(Boolean);
function mergeExtra(existing, extra) {
  const changes = [];
  existing.extra = existing.extra || {};
  for (const [col, val] of Object.entries(extra || {})) {
    if (!val) continue;
    const cur = existing.extra[col] || '';
    if (!cur) { existing.extra[col] = val; changes.push(`${col}: ${val}`); continue; }
    if (!MERGE_COLS.test(norm(col).replace(/[^a-z]/g, ''))) continue;   // grade, email…: the roster's value stands
    const have = splitVals(cur), mine = have.map(norm);
    const add = splitVals(val).filter(v => !mine.includes(norm(v)));
    if (add.length) { existing.extra[col] = [...have, ...add].join(', '); changes.push(`${col}: +${add.join(', ')}`); }
  }
  return changes;
}
function describeTwin(twin, extra) {
  const col = Object.keys(extra || {}).find(c => extra[c] && MERGE_COLS.test(norm(c).replace(/[^a-z]/g, '')) && norm(extra[c]) !== norm((twin.extra || {})[c] || ''));
  if (!col) return `already on the roster${Object.keys(extra || {}).some(c => extra[c] && norm(extra[c]) !== norm((twin.extra || {})[c] || '')) ? ' with different details' : ''}`;
  return `on the roster as <b>${esc((twin.extra || {})[col] || 'no ' + col)}</b>, this file says <b>${esc(extra[col])}</b>`;
}
async function foldNewRows(rows) {
  /* rows: [{first,last,extra,id}] into the open job. Returns counts, or null if the
     person cancelled the same-or-different question (nothing more is added after that). */
  const have = new Set(S.subjects.map(x => x.id));
  const out = { added: 0, merged: 0, skipped: 0 };
  const hits = [];
  const addRow = async r => {
    // v0.14.0: no more alias. The id another job holds is that job's business now —
    // this row is stored under [this job, id] and keeps the id every device computes.
    const sub = { id: r.id, shootId: S.shoot.id, first: r.first, last: r.last, extra: r.extra || {}, added: true, deviceId: DEVICE.id, updatedAt: nowISO(), ...stampNew() };
    await dbPut('subjects', sub);
    S.subjects.push(sub);
    have.add(sub.id);
    out.added++;
  };
  const mergeRow = async (r, twin) => {
    const changes = mergeExtra(twin, r.extra);
    if (!changes.length) { out.skipped++; return; }
    twin.updatedAt = nowISO();
    twin.dirty = 1;   // the cloud, and from there every other phone, learns the new team
    await dbPut('subjects', twin);
    out.merged++;
  };
  for (const r of rows) {
    if (have.has(r.id)) { out.skipped++; continue; }
    const twin = (r.first || r.last) && S.subjects.find(x => norm(x.first) === norm(r.first) && norm(x.last) === norm(r.last));
    if (twin) hits.push({ r, twin });
    else await addRow(r);
  }
  if (hits.length) {
    const nm = r => esc((r.first + ' ' + r.last).trim());
    const list = hits.slice(0, 8).map(h => `• ${nm(h.r)} — ${describeTwin(h.twin, h.r.extra)}`).join('<br>') + (hits.length > 8 ? `<br>• …and ${hits.length - 8} more` : '');
    const n = hits.length;
    const choice = await askChoice(`${n} name${n === 1 ? ' is' : 's are'} already on this roster`,
      `${list}<br><br>Same people (a kid who plays two sports) get the new team added to their row and keep their photo. Different people get a second row.`,
      n === 1
        ? [{ key: 'same', label: 'Same person — add to their row', primary: true }, { key: 'diff', label: 'Different person — add a second row' }]
        : [{ key: 'same', label: `Same people — add to their rows (${n})`, primary: true }, { key: 'diff', label: `Different people — add ${n} new rows` }, { key: 'each', label: 'Decide one by one' }]);
    if (!choice) return null;
    for (const h of hits) {
      let c = choice;
      if (c === 'each') {
        c = await askChoice(nm(h.r), `${describeTwin(h.twin, h.r.extra)}.`,
          [{ key: 'same', label: 'Same person', primary: true }, { key: 'diff', label: 'Different person — second row' }]);
        if (!c) return null;
      }
      if (c === 'same') await mergeRow(h.r, h.twin); else await addRow(h.r);
    }
  }
  if (out.merged) scheduleAutoSync(1500);
  return out;
}
function foldSummary(f) {
  const bits = [];
  if (f.added) bits.push(`Added ${f.added} new name${f.added === 1 ? '' : 's'}`);
  if (f.merged) bits.push(`${f.merged} ${f.merged === 1 ? 'person' : 'people'} got a team added`);
  if (f.skipped) bits.push(`${f.skipped} already here`);
  return bits.length ? bits.join(', ') : 'Nothing new in that file';
}
/* ---------- v0.14.4: add a field (column) to the job while on site ----------
   A roster arrives without jersey numbers, or the coach wants positions noted. A field is
   just one more entry in shoot.columns; every person's value lives in their own `extra`,
   which already syncs. What did NOT travel before this was the column LIST itself — the
   cloud row carried it up but no phone ever read it back — so it now merges as a union
   everywhere a job is exchanged (cloud pull, QR sync, shoot share, backup ZIP). A union can
   only grow, so two phones adding different fields at the same moment both keep both.
   Person ids and the job's sync key are computed at import and are not touched by this. */
const cleanFieldName = v => String(v ?? '').replace(/\s+/g, ' ').trim().slice(0, 40);
const fieldKey = v => norm(v).replace(/\s+/g, '');
function fieldProblem(name) {
  if (!name) return 'Type a name for the field';
  const k = fieldKey(name);
  if (['first', 'firstname', 'last', 'lastname'].includes(k.replace(/[^a-z]/g, ''))) return 'First and last name already have their own boxes';
  const hit = (S.shoot.columns || []).find(c => fieldKey(c) === k);
  return hit ? `This job already has “${hit}”` : '';
}
/* merge column names into the open job; `mine` = added on this device, so the cloud is owed it */
async function adoptColumns(cols, mine) {
  if (!S.shoot || !Array.isArray(cols)) return 0;
  const have = new Set(S.shoot.columns || []);
  const add = [];
  for (const c of cols) {
    if (typeof c !== 'string' || !c || have.has(c)) continue;
    have.add(c); add.push(c);
  }
  if (!add.length) return 0;
  S.shoot.columns = [...(S.shoot.columns || []), ...add];
  if (mine) { S.shoot.colsDirty = true; S.shoot.updatedAt = nowISO(); }
  await dbPut('shoots', S.shoot);
  return add.length;
}
async function addField(raw) {
  const name = cleanFieldName(raw);
  const prob = fieldProblem(name);
  if (prob) { toast(prob); return ''; }
  await adoptColumns([name], true);
  // no direct push: the tick pulls first, so a rename made on another phone isn't sent back over
  if (cloudReady()) scheduleAutoSync(800);
  return name;
}
const FIELD_IDEAS = ['Jersey #', 'Position', 'Grade', 'Notes'];
function askFieldName() {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const sheet = document.createElement('div'); sheet.className = 'sheet';
    let settled = false;
    const finish = v => { if (!settled) { settled = true; res(v); } };
    const closer = trackSheet(bg, sheet, () => finish(''));
    const done = v => { closer(); finish(v); };
    bg.onclick = () => done('');
    const ideas = FIELD_IDEAS.filter(n => !fieldProblem(n));
    sheet.innerHTML = `<h3>Add a field to this job</h3>
      <p style="color:var(--dim);font-size:13.5px;margin:0 0 12px;line-height:1.5">A new box on every person in “${esc(S.shoot.name)}”. It reaches the other phones at the next sync and is a column in the exports.</p>
      <input type="text" id="nfName" placeholder="e.g. Jersey #" maxlength="40" autocomplete="off">
      ${ideas.length ? `<div class="chiprow">${ideas.map(n => `<button type="button" class="chip sm" data-idea="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
      <button class="btn primary" id="nfAdd" style="margin-top:14px">Add field</button>
      <button class="btn ghost" id="nfCancel" style="margin-top:10px">Cancel</button>`;

    sheet.querySelectorAll('[data-idea]').forEach(ch => ch.onclick = () => { inp.value = ch.dataset.idea; inp.focus(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    sheet.querySelector('#nfAdd').onclick = submit;
    sheet.querySelector('#nfCancel').onclick = () => done('');
    inp.focus();
  });
}
async function addFieldFlow() {
  const name = await askFieldName();
  return name ? addField(name) : '';
}
function preferredBoardCol(filts) {
  for (const name of TEAMISH) {
    const hit = filts.find(([c]) => norm(c).replace(/[^a-z]/g, '') === name);
    if (hit) return hit[0];
  }
  return filts[0][0];
}
/* ---------- why someone wasn't photographed ----------------------------
   Separate from check-in: check-in says whether we shot them, the flag says
   why we didn't. "Absent" is the retake list; "No longer there" is a roster
   correction for the office. Flagged people leave the missing count so the
   list can actually reach zero, and a photo clears the flag automatically. */
const FLAGS = {
  absent: { label: 'Absent', tag: 'absent', color: 'var(--accent2)' },
  gone: { label: 'No longer there', tag: 'no longer there', color: 'var(--dim)' }
};
const flagOf = s => (s && FLAGS[s.flag]) ? s.flag : '';
const isExcused = s => !isDone(s) && !!flagOf(s);
const excusedCount = () => S.subjects.filter(isExcused).length;
const absentList = () => S.subjects.filter(s => flagOf(s) === 'absent' && !isDone(s));
/* last-write-wins, same rule as check-in status, so phones agree */
async function setFlag(s, val, ts, by) {
  ts = ts || Date.now();
  if (s.flagTs && ts < s.flagTs) return false;
  if ((s.flag || '') === (val || '') && s.flagTs) return false;
  s.flag = val || '';
  s.flagTs = ts;
  s.flagBy = by || DEVICE.name || DEVICE.id;
  s.updatedAt = nowISO();
  if (by !== 'cloud' && by !== 'other phone') s.dirty = 1; // ours to send
  await dbPut('subjects', s);
  return true;
}
function visibleSubjects() {
  const q = norm(S.search.trim());
  return S.subjects.filter(s => {
    if (S.statusFilter === 'missing' && isDone(s)) return false;
    if (S.statusFilter === 'missing' && isExcused(s)) return false; // shown under "Excused"
    if (S.statusFilter === 'done' && !isDone(s)) return false;
    for (const [col, val] of Object.entries(S.filters)) {
      if (!val) continue;
      const cell = String((s.extra || {})[col] || '');
      if (!cell.split(',').map(v => v.trim()).includes(val)) return false;
    }
    if (!q) return true;
    const hay = norm(displayName(s) + ' ' + Object.values(s.extra || {}).join(' '));
    return q.split(/\s+/).every(w => hay.includes(w));
  });
}
function doneCount() { return S.subjects.filter(isDone).length; }
/* Done people who belong to MORE than one value of a filtered column (a dual-sport kid) and
   match the active filters — the ones the Missing view would otherwise hide from the other
   sport's photographer. Empty when no team/group filter is set: without a team in view there
   is no "other team" to have come through. */
function alreadyInElsewhere() {
  const active = Object.entries(S.filters).filter(([, v]) => v);
  if (!active.length) return [];
  return S.subjects.filter(s => {
    if (!isDone(s)) return false;
    let multi = false;
    for (const [col, val] of active) {
      const vals = String((s.extra || {})[col] || '').split(',').map(v => v.trim()).filter(Boolean);
      if (!vals.includes(val)) return false;
      if (vals.length > 1) multi = true;
    }
    return multi;
  });
}
const otherTeamsOf = (s, col, val) => String((s.extra || {})[col] || '').split(',').map(v => v.trim()).filter(v => v && v !== val);

/* ---------- where did this person come from? (tap the "added" tag) ----------
   Answers the question that cost a whole evening with the Antonito/Centauri leak:
   when were they added, by whom, and how did this row reach THIS device. */
function showProvenance(s) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.style.maxHeight = '88vh'; sheet.style.overflowY = 'auto';
  const close = trackSheet(bg, sheet);
  bg.onclick = close;
  const when = t => { const d = new Date(t); return isNaN(d.getTime()) ? '' : d.toLocaleString(); };
  const L = [];
  if (s.addedAt && when(s.addedAt)) {
    L.push(`<div><b>Added</b> ${esc(when(s.addedAt))}${s.addedBy ? ' by <b>' + esc(s.addedBy) + '</b>' : ''}</div>`);
  } else {
    L.push(`<div style="color:var(--dim)">When they were added wasn't recorded — this person pre-dates v0.14.0, which is when the app started keeping it.</div>`);
    if (s.updatedAt && when(s.updatedAt)) L.push(`<div style="margin-top:6px">Their record last changed <b>${esc(when(s.updatedAt))}</b> <span style="color:var(--dim)">— the most recent edit, which may be long after they were added.</span></div>`);
  }
  L.push(`<div style="margin-top:6px">This copy reached this device <b>${esc(arrivedVia(s))}</b>.</div>`);
  if (!s.added) L.push(`<div style="margin-top:6px;color:var(--dim)">They came in on an imported roster rather than being added on site.</div>`);
  if (s.deviceId === 'repair') L.push(`<div style="margin-top:10px;color:var(--accent2)">⚠ Created by the orphan-photo repair: this job holds a photo of them while their name sat on another job. If they weren't photographed here, delete them — that removes only this job's copy.</div>`);
  const cols = Object.keys(s.extra || {});
  const mine = new Set(S.shoot.columns || []);
  const foreign = cols.filter(c => !mine.has(c));
  if (foreign.length) L.push(`<div style="margin-top:10px;color:var(--accent2)">⚠ Their details carry ${foreign.map(c => '<b>' + esc(c) + '</b>').join(', ')}, which this job's roster doesn't use — a sign this person was authored on a different job.</div>`);
  L.push(`<div style="margin-top:14px;color:var(--dim);font-size:12px">Job: ${esc(S.shoot.name)} · MatchDay ID <code>${esc(s.id)}</code></div>`);
  sheet.innerHTML = `<h3>${esc(displayName(s))}</h3>
    <div style="font-size:13.5px;line-height:1.55;color:var(--text)">${L.join('')}</div>
    <button class="btn ghost" id="pvClose" style="margin-top:14px">Close</button>`;
  document.body.append(bg, sheet);
  $('#pvClose').onclick = close;
}

/* ---------- team board: per-team check-in progress, tap through to that team's missing ---------- */
function teamBoard() {
  const filts = filterableColumns();
  if (!filts.length) return toast('This roster has no team/group column');
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  sheet.style.maxHeight = '78vh';
  sheet.style.overflowY = 'auto';
  const close = trackSheet(bg, sheet);
  bg.onclick = close;
  document.body.append(bg, sheet);
  let col = S.shoot.boardCol && filts.find(f => f[0] === S.shoot.boardCol) ? S.shoot.boardCol : preferredBoardCol(filts);
  const draw = () => {
    const vals = filts.find(f => f[0] === col)[1];
    const rows = vals.map(v => {
      const members = S.subjects.filter(s => String((s.extra || {})[col] || '').split(',').map(x => x.trim()).includes(v));
      const done = members.filter(isDone).length;
      const excused = members.filter(isExcused).length;
      // dual-sport kids who are done: they may have come through another team's line
      const multi = members.filter(s => isDone(s) && otherTeamsOf(s, col, v).length).length;
      return { v, total: members.length, done, excused, multi, missing: members.length - done - excused };
    });
    const totDone = doneCount(), tot = S.subjects.length, totEx = excusedCount();
    sheet.innerHTML = `
      <h3>Check-in by ${esc(col)}</h3>
      ${filts.length > 1 ? `<div style="margin-bottom:10px">${filts.map(([c]) =>
        `<span class="chip ${c === col ? 'on' : ''}" data-col="${esc(c)}">${esc(c)}</span>`).join('')}</div>` : ''}
      <div class="card" style="margin-bottom:10px">
        <h3 style="font-size:15px">Everyone</h3>
        <div class="meta">${totDone}/${tot} checked in${totEx ? ` • ${totEx} excused` : ''}${tot - totDone - totEx ? ` • ${tot - totDone - totEx} missing` : ' • complete ✓'}</div>
        <div class="progress"><i style="width:${tot ? Math.round(totDone / tot * 100) : 0}%"></i></div>
      </div>
      ${rows.map(r => `
        <div class="card" data-team="${esc(r.v)}" style="cursor:pointer;margin-bottom:8px;padding:11px 14px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <h3 style="font-size:15px;margin:0">${esc(r.v)}</h3>
            <span class="meta" style="${r.missing ? '' : 'color:var(--good)'}">${r.done}/${r.total}${r.excused ? ` • ${r.excused} excused` : ''}${r.missing ? ` • ${r.missing} missing` : ' ✓'}</span>
          </div>
          <div class="progress" style="margin-top:7px"><i style="width:${r.total ? Math.round(r.done / r.total * 100) : 0}%"></i></div>
          ${r.multi ? `<div class="meta" style="margin-top:5px;font-size:12px">${r.multi} also on another ${esc(col.toLowerCase())} — may have checked in there</div>` : ''}
        </div>`).join('')}
      <div class="meta" style="text-align:center;padding:8px 0 2px">tap a ${esc(col.toLowerCase())} to see who's missing</div>`;
    sheet.querySelectorAll('[data-col]').forEach(ch => ch.onclick = async () => {
      col = ch.dataset.col;
      S.shoot.boardCol = col;
      await dbPut('shoots', S.shoot);
      draw();
    });
    sheet.querySelectorAll('[data-team]').forEach(el => el.onclick = () => {
      for (const [c] of filts) S.filters[c] = '';
      S.filters[col] = el.dataset.team;
      S.statusFilter = 'missing';
      S.search = '';
      close();
      renderRoster();
    });
  };
  draw();
}
function drawList() {
  freeURLs();
  const list = $('#list');
  const vis = visibleSubjects();
  $('#countText').textContent = vis.length === S.subjects.length
    ? `${S.subjects.length} subjects` : `${vis.length} of ${S.subjects.length} subjects`;
  const pc = $('#pendChip');
  if (pc) {
    pc.onclick = () => cloudSyncNow();
    paintPending();
  }
  const wu = $('#wrapUpBtn');
  if (wu) {
    const anyMissing = S.subjects.some(s => !isDone(s));
    wu.style.display = (S.statusFilter === 'missing' && anyMissing) ? '' : 'none';
    wu.onclick = () => nav('/wrapup/' + S.shoot.id);
  }
  const rowHtml = (s, note) => {
    const caps = S.caps.get(s.id) || [];
    const st = S.R.get(s.id);
    const rem = !caps.length && st && st.state === 'in' ? st : null;
    if (note === undefined) note = '';
    const av = caps.length
      ? `<img src="${url(caps[caps.length - 1].thumb)}" alt=""><span class="badge">${caps.length > 1 ? caps.length : '✓'}</span>`
      : rem
        ? `<span style="color:var(--good)">✓</span><span class="badge">⇄</span>`
        : esc((s.first[0] || '') + (s.last[0] || '')).toUpperCase();
    const sub = extraLine(s) + (rem ? (extraLine(s) ? ' • ' : '') + 'on ' + (rem.by || 'other phone') : '') + (note ? (extraLine(s) || rem ? ' • ' : '') + note : '');
    return `<div class="subject ${caps.length || rem ? 'done' : ''}${isGone(s) ? ' gone' : ''}" data-id="${s.id}">
      <div class="avatar">${av}</div>
      <div class="sinfo">
        <div class="sname">${nameHtml(s)}${s.added ? ` <span class="tag" data-prov="${s.id}" style="border-bottom:1px dotted currentColor;cursor:pointer">added</span>` : ''}${s.handled ? ' <span class="tag" style="color:var(--good)">handled</span>' : ''}${flagOf(s) ? ` <span class="tag" style="color:${FLAGS[flagOf(s)].color}">${FLAGS[flagOf(s)].tag}</span>` : ''}</div>
        ${sub ? `<div class="sextra">${esc(sub)}</div>` : ''}
      </div>
      <div class="camb" data-cam="${s.id}">${ICONS.cam}</div>
    </div>`;
  };
  // search hits hidden by the active team/class filter or All/Missing/Done tab —
  // show them anyway so nobody is invisible just because you're on the wrong view
  let elsewhereHtml = '';
  const q = norm(S.search.trim());
  /* a search term can match the person's NAME or merely something else in their row —
     a parent's email, a coach's name, a team. At Salida, searching "Lauren" surfaced two
     kids whose MOTHER is lauren…@gmail.com, which read as "the app pulled up the wrong
     person". Name matches now come first; row-content matches drop below a labeled
     divider so they can never impersonate a name match. */
  const nameMatch = s => q.split(/\s+/).every(w => norm(displayName(s)).includes(w));
  if (q) {
    const visIds = new Set(vis.map(s => s.id));
    const elsewhere = S.subjects.filter(s => {
      if (visIds.has(s.id)) return false;
      const hay = norm(displayName(s) + ' ' + Object.values(s.extra || {}).join(' '));
      return q.split(/\s+/).every(w => hay.includes(w));
    });
    if (elsewhere.length) {
      elsewhere.sort((a, b) => (nameMatch(b) ? 1 : 0) - (nameMatch(a) ? 1 : 0));
      elsewhereHtml = `<div class="count" style="padding:14px 2px 8px;color:var(--accent2)">↪ Not in this view — elsewhere in the shoot:</div>` +
        elsewhere.map(rowHtml).join('');
    }
  }
  // people accounted for but not photographed: out of the work list, still one tap away
  let excusedHtml = '';
  if (S.statusFilter === 'missing' && !q) {
    const ex = S.subjects.filter(isExcused).filter(s => {
      for (const [col, val] of Object.entries(S.filters)) {
        if (!val) continue;
        const cell = String((s.extra || {})[col] || '');
        if (!cell.split(',').map(v => v.trim()).includes(val)) return false;
      }
      return true;
    });
    if (ex.length) {
      excusedHtml = `<div class="count" style="padding:16px 2px 8px">↪ Excused — ${ex.length} accounted for:</div>` +
        ex.map(rowHtml).join('');
    }
  }
  /* dual-sport kids: one row, Team "Volleyball, Cheer", ONE check-in. Once she's checked in
     at volleyball she is done, so the Missing view for Cheer hid her completely — and the cheer
     photographer read that as "she's not on my roster". Keep her on the Cheer list, with her
     check-in photo, under a divider that says she already came through another line. Only
     multi-team people appear here: a single-team kid who is done was checked in HERE. */
  let alsoHtml = '';
  if (S.statusFilter === 'missing' && !q) {
    const also = alreadyInElsewhere();
    if (also.length) {
      const whenIn = s => {
        const caps = S.caps.get(s.id) || [];
        const st = S.R.get(s.id);
        const t = caps.length ? Date.parse(caps[0].takenAt) : (st && st.state === 'in' ? st.ts : 0);
        return t ? 'checked in ' + new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'checked in';
      };
      alsoHtml = `<div class="count" style="padding:16px 2px 8px;color:var(--good)">↪ Already checked in with another team — ${also.length}, nothing to do:</div>` +
        also.map(s => rowHtml(s, whenIn(s))).join('');
    }
  }
  if (!vis.length && !elsewhereHtml && !excusedHtml && !alsoHtml) { list.innerHTML = '<div class="empty">No matches.</div>'; return; }
  let visHtml;
  if (q && vis.length) {
    const prim = vis.filter(nameMatch);
    const sec = vis.filter(s => !nameMatch(s));
    visHtml = prim.map(rowHtml).join('') +
      (sec.length ? `<div class="count" style="padding:14px 2px 8px">↪ Name doesn't match — found in their row (parent email, coach, team…):</div>` + sec.map(rowHtml).join('') : '');
  } else {
    visHtml = vis.length ? vis.map(rowHtml).join('')
      : (q ? '' : `<div class="empty">${S.statusFilter === 'missing' && (excusedHtml || alsoHtml) ? 'Everyone left is accounted for ✓' : 'No matches.'}</div>`);
  }
  list.innerHTML = visHtml + alsoHtml + elsewhereHtml + excusedHtml;
  const hc = $('#hdrCount');
  const nEx = excusedCount();
  if (hc) hc.textContent = `${doneCount()}/${S.subjects.length} checked in${nEx ? ` • ${nEx} excused` : ''} ▾`;
  list.querySelectorAll('.subject').forEach(el => {
    el.addEventListener('click', e => {
      const id = el.dataset.id;
      if (e.target.closest('[data-prov]')) {                       // tag tapped: who/when, not the person's page
        const sub = S.subjects.find(x => x.id === id);
        if (sub) showProvenance(sub);
        return;
      }
      if (e.target.closest('.camb')) nav(`/capture/${S.shoot.id}/${id}`);
      else nav(`/subject/${S.shoot.id}/${id}`);
    });
  });
}

/* ---------- wrap-up: walk the missing list with the office ----------------

          </div>
        </div>`).join('') || '<div class="empty">Nobody is missing — everyone has a photo ✓</div>'}
      ${roster.length ? `<button class="btn primary" onclick="nav('/shoot/${sh.id}')" style="margin-top:6px">Done</button>` : ''}
    </div>`;
  document.querySelectorAll('.wurow').forEach(row => {

}

        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="iconbtn" id="flipBtn" aria-label="Flip camera">${ICONS.flip}</button>
          <button class="iconbtn" id="galleryBtn" aria-label="Pick from gallery">${ICONS.gallery}</button>
        </div>
      </div>
    </div>`;
  $('#shutter').onclick = snap;
  $('#flipBtn').onclick = () => { S.facing = S.facing === 'environment' ? 'user' : 'environment'; startStream(); };
  $('#galleryBtn').onclick = () => $('#galleryInput').click();
  wirePinchZoom();
  await startStream();
}

/* ---------- camera zoom: hardware zoom via track constraints, pinch + slider ---------- */
let zoomTrack = null, zoomPending = false;
function setupZoom() {
  zoomTrack = null;
  const ui = $('#zoomUI');
  if (!ui) return;
  const track = S.stream && S.stream.getVideoTracks && S.stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return ui.classList.add('hidden');
  let caps = null;
  try { caps = track.getCapabilities(); } catch (e) {}
  if (!caps || !caps.zoom || caps.zoom.max <= caps.zoom.min) return ui.classList.add('hidden');
  zoomTrack = track;
  const sl = $('#zoomSlider');
  sl.min = caps.zoom.min;
  sl.max = Math.min(caps.zoom.max, Math.max(caps.zoom.min * 10, 10)); // 10× is plenty for a check-in line
  sl.step = caps.zoom.step || 0.1;
  let cur = caps.zoom.min;
  try { cur = track.getSettings().zoom || cur; } catch (e) {}
  sl.value = cur;
  sl.oninput = () => setZoom(+sl.value, true);
  ui.classList.remove('hidden');
  updateZoomLbl(cur);
}
function updateZoomLbl(v) {
  const l = $('#zoomLbl');
  if (l) l.textContent = (Math.round(v * 10) / 10) + '×';
}
function setZoom(v, fromSlider) {
  const sl = $('#zoomSlider');
  if (!zoomTrack || !sl) return;
  v = Math.max(+sl.min, Math.min(+sl.max, v));
  if (!fromSlider) sl.value = v;
  updateZoomLbl(v);
  if (zoomPending) return;
  zoomPending = true;
  requestAnimationFrame(async () => {
    zoomPending = false;
    try { await zoomTrack.applyConstraints({ advanced: [{ zoom: +sl.value }] }); } catch (e) {}
  });
}
function wirePinchZoom() {
  const cap = document.querySelector('.cap');
  if (!cap) return;
  let pinch = null;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  cap.addEventListener('touchstart', e => {
    if (e.touches.length === 2 && zoomTrack) pinch = { d: dist(e), z: +$('#zoomSlider').value };
  }, { passive: true });
  cap.addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2) { e.preventDefault(); setZoom(pinch.z * (dist(e) / pinch.d)); }
  }, { passive: false });
  cap.addEventListener('touchend', () => { pinch = null; }, { passive: true });
}
async function startStream() {
  stopStream();
  const vid = $('#vid');
  if (!vid) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFallbackFlow();
  const constraints = { video: { facingMode: S.facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false };
  try {
    S.stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = S.stream;
    setupZoom();
  } catch (e) {
    console.warn('getUserMedia failed, retrying once', e);
    await new Promise(r => setTimeout(r, 600)); // camera often frees up after a moment
    try {
      S.stream = await navigator.mediaDevices.getUserMedia(constraints);
      const v2 = $('#vid');
      if (v2) { v2.srcObject = S.stream; setupZoom(); }
    } catch (e2) {
      console.warn('getUserMedia retry failed', e2);
      camFallbackFlow();
    }
  }
}
function camFallbackFlow() {
  toast('Using system camera');
  $('#camFallback').click();
}
async function processPickedImage(f, warnOld) {
  if (!f || !S.capSubject) return;
  if (warnOld) {
    // safety net: the system picker can hand back an OLD gallery photo instead of a fresh shot
    const ageMs = Date.now() - (f.lastModified || 0);
    if (f.lastModified && ageMs > 10 * 60 * 1000) {
      const when = new Date(f.lastModified).toLocaleString();
      if (!confirm(`⚠ This image was taken ${when} — that's not a fresh check-in photo.\n\nUse it for ${displayName(S.capSubject)} anyway?`)) {
        toast('Old photo discarded — try again');
        return;
      }
    }
  }
  const img = new Image();
  const u = URL.createObjectURL(f);
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = u; }); }
  catch (e) { URL.revokeObjectURL(u); return toast('Could not read that image'); }
  await savePhotoFromSource(img, img.naturalWidth, img.naturalHeight);
  URL.revokeObjectURL(u);
}
$('#camFallback').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  await processPickedImage(f, true);   // unexpected path — guard against stale picks
});
$('#galleryInput').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  await processPickedImage(f, false);  // deliberate gallery choice — no age nag
});
async function snap() {
  const vid = $('#vid');
  if (!vid || !vid.videoWidth) return camFallbackFlow();
  flash();
  await savePhotoFromSource(vid, vid.videoWidth, vid.videoHeight);
}
function scaleBlob(src, sw, sh, maxEdge, quality) {
  const k = Math.min(1, maxEdge / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(src, 0, 0, w, h);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', quality));
}
async function savePhotoFromSource(src, sw, sh) {
  const s = S.capSubject;
  const [jpeg, thumb] = await Promise.all([
    scaleBlob(src, sw, sh, 1280, 0.85),
    scaleBlob(src, sw, sh, 180, 0.7)
  ]);
  const cap = { id: uid(), shootId: S.shoot.id, subjectId: s.id, thumb, takenAt: nowISO(), deviceId: DEVICE.id };
  await dbPut('captures', cap);
  await dbPut('photos', { id: cap.id, blob: jpeg });
  if (!S.caps.has(s.id)) S.caps.set(s.id, []);
  S.caps.get(s.id).push(cap);
  await setStatus(s.id, 'in', Date.now(), DEVICE.name || DEVICE.id);
  if (flagOf(s)) { await setFlag(s, ''); cloudPushOneSubject(s); } // they turned up after all
  cloudPushOne(cap, s); // background upload when cloud is set up and we're online
  paintPending();
  const t = $('#capThumb');
  if (t) t.innerHTML = `<img src="${url(thumb)}">`;
  toast(displayName(s) + ' saved ✓', true);
  // auto-return to the roster for the next person in line
  setTimeout(() => {
    if (location.hash.startsWith('#/capture/')) {
      S.search = '';
      nav('/shoot/' + S.shoot.id);
    } else if (location.hash.startsWith('#/subject/')) {
      renderSubject(s.id);   // gallery-add from the detail screen: refresh the photo grid
    } else if (location.hash.startsWith('#/shoot/') && $('#list')) {
      drawList();            // saved while the roster was on screen — show it straight away
    }
  }, 550);
}

/* ---------- database suggestions while adding a walk-up ----------
   With Cloud Sync connected and internet available, typing a name on
   the Add Subject screen searches every OTHER shoot's roster in the
   database and offers tap-to-fill matches. */
let sugTimer = null;
function wireSuggest() {
  const box = $('#sugBox');
  if (!box || !cloudReady()) return;
  const clean = v => v.trim().replace(/[(),.*%\\]/g, '');
  const go = () => {
    clearTimeout(sugTimer);
    sugTimer = setTimeout(async () => {
      if (!navigator.onLine || !$('#sugBox')) return;
      const a = clean($('#eFirst').value), b = clean($('#eLast').value);
      if ((a + b).length < 2) { box.innerHTML = ''; return; }
      let filter;
      const enc = encodeURIComponent;
      if (a && b) filter = `or=(and(first_name.ilike.${enc(a)}*,last_name.ilike.${enc(b)}*),and(first_name.ilike.${enc(b)}*,last_name.ilike.${enc(a)}*))`;
      else { const t = a || b; filter = `or=(first_name.ilike.${enc(t)}*,last_name.ilike.${enc(t)}*)`; }
      let rows = [];
      try {
        rows = (await sbJson(`/rest/v1/md_subjects?${filter}&shoot_key=neq.${S.shoot.syncKey}&limit=12&select=first_name,last_name,extra`)) || [];
      } catch (e) { return; }
      if (!$('#sugBox')) return; // navigated away while fetching
      const seen = new Set(), out = [];
      for (const r of rows) {
        const k = norm((r.first_name || '') + '|' + (r.last_name || ''));
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(r);
        if (out.length >= 5) break;
      }
      box.innerHTML = out.length
        ? `<label class="f" style="margin-top:0">From your database — tap to fill:</label>` + out.map((r, i) => {
            const ex = Object.values(r.extra || {}).filter(Boolean).join(' • ');
            return `<div class="subject" data-sug="${i}" style="padding:8px 12px">
              <div class="sinfo"><div class="sname">${esc(r.first_name)} <b>${esc(r.last_name)}</b></div>
              ${ex ? `<div class="sextra">${esc(ex)}</div>` : ''}</div>
            </div>`;
          }).join('')
        : '';
      box.querySelectorAll('[data-sug]').forEach(el => el.onclick = () => {
        const r = out[+el.dataset.sug];
        $('#eFirst').value = r.first_name || '';
        $('#eLast').value = r.last_name || '';
        document.querySelectorAll('.eExtra').forEach(inp => {
          const col = norm(inp.dataset.col).replace(/[^a-z0-9]/g, '');
          for (const [k, v] of Object.entries(r.extra || {})) {
            if (v && norm(k).replace(/[^a-z0-9]/g, '') === col) inp.value = v;
          }
        });
        box.innerHTML = '';
        if (smartSync) smartSync(); // top up any still-blank full-name column
        document.querySelectorAll('.eExtra').forEach(inp => inp.dispatchEvent(new Event('input')));
        toast('Filled from database', true);
      });
    }, 350);
  };
  $('#eFirst').addEventListener('input', go);
  $('#eLast').addEventListener('input', go);
}

/* ---------- smart roster fields ----------------------------------------
   Two time savers on the Add/Edit screen, both learned from the CSV itself
   rather than guessed from column headers:

   1. NAME MIRROR COLUMNS. Some columns just hold a copy of the person's
      name — "Full Name" on school rosters, and Student ID on team rosters
      (PhotoDay wants the full name there). If most rows in a column already
      read as that row's own name, new entries get it typed for them, in the
      same arrangement the CSV uses ("First Last", "Last First", "Last, First").
      A real Student ID column full of numbers never matches, so it's left alone.

   2. VALUE CHIPS + SUGGESTIONS. Columns with a small set of repeated values
      (Team, Grade, School) get tap-to-fill chips and a type-ahead list built
      from the roster. Columns where somebody already holds two values
      ("C Team, JV") toggle instead of replace, so multi-team athletes work.
------------------------------------------------------------------------ */
const NAME_HEADERS = ['fullname', 'name', 'studentname', 'athletename', 'subjectname', 'playername', 'displayname'];
const ID_HEADERS = ['studentid', 'id', 'studentnumber', 'subjectid', 'athleteid'];
function buildName(fmt, f, l) {
  f = (f || '').trim(); l = (l || '').trim();
  if (!f || !l) return (f || l);
  if (fmt === 'LF') return l + ' ' + f;
  if (fmt === 'L,F') return l + ', ' + f;
  return f + ' ' + l;
}
function smartFieldPlan() {
  const cols = S.shoot.columns || [];
  const sq = v => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const natCmp = (a, b) => {
    const na = parseFloat(a), nb = parseFloat(b), aN = /^\d/.test(a), bN = /^\d/.test(b);
    if (aN && bN && na !== nb) return na - nb;
    if (aN !== bN) return aN ? -1 : 1;
    return a.localeCompare(b);
  };
  const teamish = !!S.shoot.boardCol || cols.some(c => /team|squad|sport|roster/.test(sq(c)));
  const plan = new Map();
  for (const c of cols) {
    let seen = 0, fl = 0, lf = 0, comma = 0;
    let multi = S.shoot.boardCol === c || /team|squad|sport|activity|club/.test(sq(c));
    const vals = new Map();
    for (const s of S.subjects) {
      const raw = String((s.extra || {})[c] || '').trim();
      if (!raw) continue;
      seen++;
      if (s.first && s.last) {
        const a = sq(raw), f = sq(s.first), l = sq(s.last);
        if (a && a === f + l) { fl++; if (raw.includes(',')) comma++; }
        else if (a && a === l + f) { lf++; if (raw.includes(',')) comma++; }
      }
      if (raw.includes(',')) multi = true;
      if (vals.size <= 60) for (const part of raw.split(',')) {
        const v = part.trim();
        if (v && v.length <= 28 && !vals.has(norm(v))) vals.set(norm(v), v);
      }
    }
    let mirror = null;
    if (seen && (fl + lf) / seen >= 0.6) mirror = lf > fl ? (comma > lf / 2 ? 'L,F' : 'LF') : 'FL';
    else if (!seen) {
      const h = sq(c);
      if (NAME_HEADERS.includes(h)) mirror = 'FL';
      else if (teamish && ID_HEADERS.includes(h)) mirror = 'FL'; // team roster: PhotoDay wants the name here
    }
    const list = mirror ? [] : [...vals.values()].sort(natCmp);
    const show = list.length && list.length <= 40 ? list : [];
    plan.set(c, { mirror, values: show, chips: show.length > 0 && show.length <= 12, multi });
  }
  return plan;
}
let smartSync = null; // re-run name mirroring after the database suggestion fills the form
function wireSmartFields(plan) {
  const inputs = [...document.querySelectorAll('.eExtra')];
  const byCol = c => inputs.find(i => i.dataset.col === c);
  const mirrors = inputs.filter(i => (plan.get(i.dataset.col) || {}).mirror);
  const F = () => ($('#eFirst') || {}).value || '', L = () => ($('#eLast') || {}).value || '';
  // seed: a value that already matches this person's name stays on auto (so fixing a
  // typo in the last name fixes the full name too); anything else is treated as hand-typed
  mirrors.forEach(i => { i.dataset.auto = buildName(plan.get(i.dataset.col).mirror, F(), L()); });
  smartSync = () => {
    for (const i of mirrors) {
      const next = buildName(plan.get(i.dataset.col).mirror, F(), L());
      const cur = i.value.trim();
      if (cur === '' || cur === (i.dataset.auto || '')) { i.value = next; i.dataset.auto = next; }
    }
  };
  if ($('#eFirst')) $('#eFirst').addEventListener('input', smartSync);
  if ($('#eLast')) $('#eLast').addEventListener('input', smartSync);
  document.querySelectorAll('.chiprow').forEach(row => {
    const inp = byCol(row.dataset.chipcol);
    if (!inp) return;
    // every pill toggles: tap adds, tap again removes. Nothing has to already hold two
    // values for a two-team athlete to be enterable, and a mis-tap clears with a second tap.
    const order = new Map([...row.querySelectorAll('.chip')].map((ch, i) => [norm(ch.dataset.val), i]));
    const parts = () => inp.value.split(',').map(x => x.trim()).filter(Boolean);
    // keep the field in the roster's own order however the pills were tapped; anything
    // typed by hand that isn't a pill keeps its place at the end
    const tidy = list => {
      const known = list.filter(v => order.has(norm(v))).sort((a, b) => order.get(norm(a)) - order.get(norm(b)));
      return known.concat(list.filter(v => !order.has(norm(v))));
    };
    const paint = () => {
      const cur = new Set(parts().map(norm));
      row.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', cur.has(norm(ch.dataset.val))));
    };
    row.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
      const v = ch.dataset.val, k = norm(v);
      let list = parts();
      if (list.some(x => norm(x) === k)) list = list.filter(x => norm(x) !== k);
      else list = tidy(list.concat([v]));
      inp.value = list.join(', ');
      paint();
    });
    inp.addEventListener('input', paint);
    paint();
  });
}

/* ---------- subject detail / add / edit ---------- */

          <div class="ph" id="addGal" title="Add from gallery" style="display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer">${ICONS.gallery}</div>

        <button class="btn danger ghost" id="delSubBtn" style="margin-top:26px">Delete subject</button>` : ''}
    </div>`;
  /* v0.14.3 — Kelly's misspelled names (Center, 09-21). Two holes, both closed here:
     1. On a phone the first tap on Save only closed the keyboard / Team suggestion list;
        the page jumped and the tap missed. Save now keeps focus on pointerdown (no blur,

  const readForm = () => {

    finally { saving = false; }

  // v0.14.4: a new field drops into the form in place — nothing typed so far is lost
  $('#addFieldBtn').onclick = async () => {
